  <script type="application/json" id="curriculum-data">{"official":{"dates":"5 y 6 de noviembre de 2026","schedule":"5 de noviembre: ámbito científico-tecnológico, 10:00-13:00; ámbito social, 15:30-17:30. 6 de noviembre: catalán y castellano, 10:00-13:00; lengua extranjera, 13:30-14:30. La identificación empieza media hora antes.","rules":"La prueba se divide en tres ámbitos. Para titular hay que superar los tres. El ámbito de comunicación suma catalán, castellano e inglés: exige al menos 150/300 y, además, un mínimo de 40/100 tanto en catalán como en castellano. Inglés no tiene mínimo propio. El ámbito científico-tecnológico vale 100 puntos y dura 3 horas; el social vale 100 puntos y dura 2 horas.","materials":"En comunicación no se permiten diccionarios. En el ámbito científico-tecnológico se permite una calculadora básica no programable que no esté integrada en un dispositivo de comunicación o reproducción.","sources":[["Tria Educativa - descripción oficial","https://triaeducativa.gencat.cat/ca/proves/proves-lliures/titol-geso-mes-18/descripcio/"],["Tria Educativa - calendario 2.ª convocatoria 2026","https://triaeducativa.gencat.cat/ca/proves/proves-lliures/titol-geso-mes-18/calendari/segona-convocatoria/"],["Repositorio oficial - muestras y pautas de corrección 2026","https://repositori.educacio.gencat.cat/handle/20.500.12694/7772"],["Repositorio oficial - pauta de corrección 10/2024","https://repositori.educacio.gencat.cat/handle/20.500.12694/6930"],["XTEC - módulos del currículo GESO para personas adultas","https://xtec.gencat.cat/ca/curriculum/educacio-llarg-vida/ensenyaments-curriculum/"]]},"subjects":[{"key":"matematicas","title":"Matemáticas","subtitle":"Del cálculo básico a la resolución de problemas del ámbito científico-tecnológico","color":"#2563EB","domain":"ámbito científico-tecnológico (3 horas)","sourceNote":"En las pautas 2024 y 2/2026 las matemáticas aparecen dentro de situaciones reales: diseño de objetos, costes, datos, escalas, volúmenes, gráficas y probabilidad. Se puntúan las operaciones, la unidad y la interpretación.","examWeight":"El ámbito científico-tecnológico 2/2026 contiene cinco actividades de 13, 24, 13, 28 y 22 puntos; las materias aparecen mezcladas.","chapters":[{"title":"Números, signos y jerarquía de operaciones","goals":["Conjuntos numéricos: distinguir naturales, enteros, racionales e irracionales","Signos: operar sin perder negativos","Jerarquía: resolver en el orden correcto","Estimación: detectar resultados absurdos"],"sections":[["Explicación desde cero",["Los números naturales sirven para contar; los enteros añaden el cero y los negativos. Los racionales pueden escribirse como fracción de enteros y su decimal es exacto o periódico. Los irracionales, como √2 o π, tienen infinitas cifras no periódicas. Racionales e irracionales forman los reales.","En la recta numérica, estar más a la derecha significa ser mayor. Con negativos, −2 es mayor que −7. El valor absoluto |−7| es 7: mide distancia al cero, no el signo.","Suma y resta: restar equivale a sumar el opuesto. Multiplicación y división: signos iguales dan positivo y signos distintos, negativo. La jerarquía es paréntesis; potencias y raíces; multiplicaciones y divisiones de izquierda a derecha; sumas y restas de izquierda a derecha.","Antes de calcular, estima. Si 19,8×4,9 ronda 20×5=100, un resultado 9,7 revela un error decimal. Esta comprobación rápida evita muchos fallos de examen."]]],"rules":["a − b = a + (−b)","(−)·(−)=+; (+)·(−)=−","Paréntesis → potencias/raíces → ×/÷ → +/−"],"examples":[["Operación combinada","Calcula 18−3·(2−7). Primero paréntesis: 2−7=−5. Después multiplicación: 3·(−5)=−15. Finalmente 18−(−15)=33."],["Comparar números","Ordena −3, 0, −1,5 y 2/3. En la recta: −3<−1,5<0<0,666…; por tanto el orden es −3, −1,5, 0, 2/3."]],"mistakes":["Hacer primero una suma porque aparece antes a la izquierda, ignorando la jerarquía.","Confundir −3² con (−3)²: el primero es −9 y el segundo 9.","Creer que un número con mayor valor absoluto siempre es mayor: −10<−2."],"exam":"Suele estar escondido dentro de precios, temperaturas, desniveles o cálculos científicos. Se puntúa el procedimiento y el resultado con unidad cuando procede.","exercises":["Clasifica 0, −8, 3/5, √9 y √7 en los conjuntos más pequeños posibles.","Calcula 7−2·[5−(−3)].","Ordena de menor a mayor: −0,4; −2/5; 0,39; 1/3.","Una cuenta está a −35 € y entra un ingreso de 82 €. Después se cargan 19 €. ¿Saldo final?","Evalúa 4−(−2)³+18÷(−3)."],"solutions":["0 es entero; −8 entero; 3/5 racional; √9=3 natural; √7 irracional.","[5−(−3)]=8; 2·8=16; 7−16=−9.","−2/5=−0,4, por tanto son iguales; luego 1/3≈0,333 y 0,39: −0,4=−2/5<1/3<0,39.","−35+82−19=28 €. El saldo queda positivo.","(−2)³=−8; 4−(−8)−6=6."],"checklist":["Distingo cada conjunto numérico.","Aplico signos y jerarquía sin improvisar.","Estimo antes de aceptar un resultado."]},{"title":"Fracciones, decimales y divisibilidad","goals":["Fracción: entender parte, cociente y razón","Equivalencia: simplificar y comparar","Operaciones: usar denominadores correctamente","Decimal: pasar entre fracción, decimal y porcentaje"],"sections":[["Explicación desde cero",["Una fracción a/b representa a dividido entre b, con b≠0. Fracciones equivalentes se obtienen multiplicando o dividiendo numerador y denominador por el mismo número. Simplificar es dividir por factores comunes hasta llegar a una fracción irreducible.","Para sumar o restar hacen falta denominadores iguales; se busca el mínimo común múltiplo. Para multiplicar se multiplican numeradores y denominadores. Para dividir se multiplica por la inversa de la segunda fracción.","Un decimal exacto termina; uno periódico repite cifras. Para comparar, conviértelos a la misma forma. 3/8=0,375 y 37%=0,37, por lo que 3/8 es ligeramente mayor.","Divisibilidad: un número es divisible por 2 si acaba en cifra par; por 3 si sus cifras suman múltiplo de 3; por 5 si acaba en 0 o 5; por 9 si la suma de cifras es múltiplo de 9. El MCD reparte en grupos máximos iguales; el mcm sincroniza repeticiones."]]],"rules":["a/b + c/d = (ad+bc)/bd","a/b ÷ c/d = a/b · d/c","decimal ×100 = porcentaje"],"examples":[["Suma","5/6−1/4. mcm(6,4)=12: 10/12−3/12=7/12."],["Parte de una cantidad","Tres quintos de 250 son 250·3/5=150. También: 250÷5=50 y 50·3=150."]],"mistakes":["Sumar también los denominadores.","Invertir la primera fracción al dividir, en vez de la segunda.","Redondear demasiado pronto y arrastrar error."],"exam":"Aparece en dosis, repartos, escalas, concentraciones, probabilidades y porcentajes. Conviene mantener fracciones exactas hasta el final.","exercises":["Simplifica 84/126.","Calcula 2/3+5/12.","Calcula 7/10÷14/15.","¿Qué es mayor: 0,58 o 7/12?","Dos luces parpadean cada 18 s y 24 s. Si coinciden ahora, ¿cuándo coincidirán?"],"solutions":["MCD(84,126)=42; queda 2/3.","8/12+5/12=13/12=1 1/12.","7/10·15/14=3/4.","7/12≈0,5833, por tanto es mayor que 0,58.","mcm(18,24)=72 s."],"checklist":["Simplifico antes o después de operar.","Sé hallar MCD y mcm.","Convierto sin confundir 0,5 con 5 %."]},{"title":"Potencias, raíces y notación científica","goals":["Potencias: aplicar propiedades","Raíces: reconocer operaciones inversas","Notación científica: expresar magnitudes grandes y pequeñas","Orden de magnitud: interpretar el exponente"],"sections":[["Explicación desde cero",["En aⁿ, a es la base y n indica cuántas veces se multiplica. Exponente cero da 1 si a≠0; exponente negativo indica inverso. Las propiedades solo permiten combinar potencias con la misma base o el mismo exponente en casos concretos.","La raíz cuadrada de x es el número no negativo cuyo cuadrado es x. √49=7. En números reales no existe √(−9). Si no es exacta, se estima entre cuadrados perfectos o se usa calculadora.","Notación científica tiene la forma a·10ⁿ con 1≤|a|<10. Mover la coma a la izquierda da exponente positivo; moverla a la derecha, negativo. Es fundamental conservar unidades.","En productos científicos se multiplican coeficientes y se suman exponentes; después se normaliza el coeficiente."]]],"rules":["aᵐ·aⁿ=aᵐ⁺ⁿ","aᵐ/aⁿ=aᵐ⁻ⁿ","(aᵐ)ⁿ=aᵐⁿ","√(a²)=|a|"],"examples":[["Notación científica","0,0000452=4,52·10⁻⁵ porque la coma se desplaza 5 lugares a la derecha."],["Producto","(3·10⁴)(2·10⁻⁷)=6·10⁻³."]],"mistakes":["Sumar exponentes al sumar potencias: 10²+10³ no es 10⁵.","Escribir un coeficiente 45,2 en notación científica sin normalizar.","Olvidar que √(−) no es real en este nivel."],"exam":"Se usa con células, población, distancias astronómicas, consumo y unidades microscópicas. La calculadora ayuda, pero debes interpretar la pantalla.","exercises":["Escribe 7.230.000 en notación científica.","Escribe 6,4·10⁻⁴ en decimal.","Simplifica 2³·2⁵÷2⁴.","Calcula √144+∛27.","Una bacteria mide 2,5·10⁻⁶ m. ¿Cuánto miden 4·10³ bacterias alineadas?"],"solutions":["7,23·10⁶.","0,00064.","2^(3+5−4)=2⁴=16.","12+3=15.","2,5·4·10^(−6+3)=10·10⁻³=10⁻² m=0,01 m."],"checklist":["Normalizo siempre la notación científica.","Distingo producto de suma.","Puedo estimar una raíz entre dos enteros."]},{"title":"Proporcionalidad, porcentajes e interés","goals":["Razón: comparar magnitudes","Proporción: decidir si es directa o inversa","Porcentaje: aplicar aumentos y descuentos","Interés simple: relacionar capital, tipo y tiempo"],"sections":[["Explicación desde cero",["Dos magnitudes son directamente proporcionales si al multiplicar una por k la otra también se multiplica por k; el cociente y/x es constante. Son inversamente proporcionales si su producto x·y es constante.","La regla de tres es una herramienta, no un reflejo automático. Primero pregunta: si una magnitud aumenta, ¿la otra aumenta o disminuye? Después plantea la relación con unidades.","Un porcentaje es una fracción sobre 100. Para aumentar un p %, multiplica por 1+p/100; para descontar, por 1−p/100. Dos cambios sucesivos no se suman: un +20 % y un −20 % dejan 0,96 del precio inicial.","En interés simple, los intereses no se incorporan al capital: I=C·r·t, con r en tanto por uno y t en años. El importe final es C+I."]]],"rules":["Directa: y=kx","Inversa: xy=k","Final con aumento: inicial·(1+p/100)","I=C·r·t"],"examples":[["Descuento e IVA","Producto de 80 € con 15 % de descuento y después 21 % de IVA: 80·0,85=68; 68·1,21=82,28 €. El orden no altera el producto, pero no se calcula 21−15=6 %."],["Inversa","4 personas tardan 15 h; 6 personas, al mismo ritmo: 4·15=6·t; t=10 h."]],"mistakes":["Aplicar regla de tres directa a una relación inversa.","Restar el porcentaje como número: 60−0,2 en vez de 60·0,8.","Sumar porcentajes sucesivos."],"exam":"Muy frecuente: descuentos, energía, recetas, escalas y comparaciones de ofertas. Escribe siempre qué significa el resultado.","exercises":["El 35 % de 480.","Un precio de 250 € sube un 8 %. ¿Nuevo precio?","Tras un 25 % de descuento pagas 90 €. ¿Precio original?","8 máquinas hacen un lote en 6 h. ¿Cuánto tardan 12?","Calcula el interés simple de 1.200 € al 3 % anual durante 9 meses."],"solutions":["480·0,35=168.","250·1,08=270 €.","Original·0,75=90; original=120 €.","8·6=12·t; t=4 h.","t=9/12=0,75; I=1200·0,03·0,75=27 €; total 1.227 €."],"checklist":["Identifico directa/inversa antes de operar.","Uso factores multiplicativos.","Puedo recuperar el valor inicial."]},{"title":"Álgebra, ecuaciones y sistemas","goals":["Expresión algebraica: traducir lenguaje a símbolos","Ecuación: mantener la igualdad","Problema: definir incógnita y comprobar","Sistema: resolver dos condiciones simultáneas"],"sections":[["Explicación desde cero",["Una expresión algebraica combina números, letras y operaciones. Los términos semejantes tienen la misma parte literal: 3x−5x=−2x, pero 3x+5x² no se reduce.","Resolver una ecuación consiste en obtener valores que hacen verdadera la igualdad. Haz la misma operación en ambos miembros, elimina paréntesis con distributiva y agrupa términos. Los denominadores pueden eliminarse multiplicando toda la ecuación por el mcm.","En problemas, define la incógnita con unidad, traduce frase a frase y comprueba en el contexto. Una edad negativa o 2,3 personas indica que el modelo o el cálculo están mal.","Un sistema de dos ecuaciones lineales puede resolverse por sustitución, igualación o reducción. La solución es el punto que satisface ambas ecuaciones."]]],"rules":["a(b+c)=ab+ac","ax+b=c ⇒ x=(c−b)/a","Sistema: la solución debe cumplir las dos ecuaciones"],"examples":[["Ecuación","3(2x−1)+5=20: 6x−3+5=20; 6x+2=20; 6x=18; x=3. Comprobación: 3·5+5=20."],["Sistema","x+y=10 y 2x+y=14. Restamos la primera de la segunda: x=4; entonces y=6."]],"mistakes":["Cambiar un término de lado sin entender que se hace la misma operación.","No distribuir el signo menos: −(x−3)=−x+3.","Dar x e y sin indicar qué representan."],"exam":"Los modelos recientes usan tarifas, ingresos, cantidades y repartos. La ecuación suele ser sencilla; lo difícil es traducir el texto.","exercises":["Reduce 4x−3+2x+7.","Resuelve 5x−8=27.","Resuelve 2(x−3)=x+5.","Dos entradas cuestan 23 €. La adulta cuesta 5 € más que la juvenil. Halla ambas.","Resuelve x+y=17; x−y=5."],"solutions":["6x+4.","5x=35; x=7.","2x−6=x+5; x=11.","Juvenil x; adulta x+5. 2x+5=23; x=9 €. Adulta 14 €.","Sumando: 2x=22; x=11, y=6."],"checklist":["Reduzco y uso distributiva.","Compruebo soluciones.","Planteo sistemas desde dos condiciones."]},{"title":"Funciones, tablas y gráficas","goals":["Variable: distinguir independiente y dependiente","Función: relacionar entradas y salidas","Gráfica: elegir escala y rotular ejes","Tendencia: describir crecimiento, descenso y constancia"],"sections":[["Explicación desde cero",["Una función asigna a cada valor de x un único valor de y. x suele ser la variable independiente y se coloca en el eje horizontal; y depende de x y va en el vertical.","Una tabla permite representar puntos (x,y). La escala debe aprovechar el espacio, ser regular y llevar unidades. No unas puntos si la situación es discreta, por ejemplo número de personas.","La función lineal y=mx+n tiene pendiente m y ordenada en el origen n. m indica cuánto cambia y cuando x aumenta una unidad. Si m>0 crece; si m<0 decrece.","En una gráfica real busca máximos, mínimos, intervalos de crecimiento, cruces y cambios. Describe con magnitudes: 'al aumentar la intensidad, disminuye la duración', no solo 'baja'."]]],"rules":["Pendiente m=(y₂−y₁)/(x₂−x₁)","Recta: y=mx+n","Eje x: independiente; eje y: dependiente"],"examples":[["Tarifa","Una compañía cobra 6 € fijos y 0,12 €/min: C(m)=6+0,12m. Para 50 min: 12 €. La pendiente es el coste por minuto."],["Interpretación","Si una población pasa de 200 a 500 en 6 semanas, la variación media es (500−200)/6=50 individuos/semana."]],"mistakes":["Intercambiar los ejes.","Usar escalas irregulares sin indicarlo.","Confundir pendiente con valor inicial."],"exam":"Las pautas oficiales penalizan no poner escala adecuada, unidades o la variable independiente en abscisas. También piden describir la relación.","exercises":["Para y=3x−2, calcula y cuando x=0,2,5.","Halla la pendiente entre (2,7) y (6,15).","Una tarifa A: 10+0,05x; B: 4+0,09x. ¿Cuándo cuestan igual?","Describe una gráfica que sube de 0 a 10 min, se mantiene de 10 a 15 y baja después.","Una batería tiene 100 % y pierde 8 puntos por hora. Escribe la función y calcula cuándo llega al 20 %."],"solutions":["−2, 4 y 13.","(15−7)/(6−2)=2.","10+0,05x=4+0,09x; 6=0,04x; x=150 unidades.","Crecimiento en 0-10, constancia en 10-15 y decrecimiento después de 15.","B(t)=100−8t; 20=100−8t; t=10 h."],"checklist":["Rotulo ejes y unidades.","Calculo e interpreto pendiente.","Leo intervalos y no solo puntos."]},{"title":"Geometría, Pitágoras, escala y trigonometría","goals":["Perímetro y área: elegir fórmula según figura","Pitágoras: hallar lados en triángulos rectángulos","Escala: pasar de plano a realidad","Trigonometría: usar seno, coseno y tangente"],"sections":[["Explicación desde cero",["Perímetro es longitud del borde; área es superficie. No pueden expresarse en la misma unidad: cm frente a cm². Descompón figuras compuestas en rectángulos, triángulos y círculos.","En un triángulo rectángulo, la hipotenusa está frente al ángulo recto y es el lado mayor. Pitágoras relaciona los tres lados. Si buscas un cateto, resta cuadrados antes de hacer la raíz.","Escala 1:n significa que 1 unidad en el plano representa n unidades reales. Mantén las unidades iguales antes de usar la razón.","Respecto a un ángulo α: seno=opuesto/hipotenusa; coseno=adyacente/hipotenusa; tangente=opuesto/adyacente. Dibuja y etiqueta antes de pulsar la calculadora, que debe estar en grados."]]],"rules":["Rectángulo: A=bh","Triángulo: A=bh/2","Círculo: A=πr²; L=2πr","a²+b²=c²","sin=op/hip; cos=ady/hip; tan=op/ady"],"examples":[["Pitágoras","Catetos 9 m y 12 m: c=√(81+144)=√225=15 m."],["Escala","En 1:25.000, 6 cm representan 150.000 cm=1.500 m=1,5 km."],["Coseno","Rampa de 12 m a 40° con el suelo: proyección horizontal d=12·cos40°≈9,19 m."]],"mistakes":["Usar diámetro como radio.","Sumar lados cuando piden área.","Aplicar Pitágoras en un triángulo no rectángulo.","Calculadora en radianes."],"exam":"En 2026 se pidió volumen cilíndrico, coseno, semejanza y Pitágoras dentro de problemas técnicos y ambientales.","exercises":["Área y perímetro de un rectángulo 8×5 m.","Área de un círculo de radio 3 m.","Hipotenusa con catetos 5 y 12.","En escala 1:50.000, ¿qué distancia real son 3,4 cm?","Una escalera de 5 m forma 65° con el suelo. ¿Altura alcanzada?"],"solutions":["A=40 m²; P=26 m.","9π≈28,27 m².","13.","170.000 cm=1,7 km.","h=5·sin65°≈4,53 m."],"checklist":["Distingo perímetro, área y volumen.","Identifico hipotenusa.","Uso unidades coherentes y grados."]},{"title":"Geometría espacial y medida","goals":["Volumen: interpretar capacidad","Prismas y cilindros: calcular y despejar","Conversión: mover entre L, mL, cm³ y m³","Semejanza: usar proporciones de longitudes"],"sections":[["Explicación desde cero",["Volumen mide espacio ocupado y se expresa en unidades cúbicas. Un litro equivale a 1 dm³ y 1 mL a 1 cm³. Como las unidades están al cubo, 1 m³ son 1.000 L, no 100.","Prismas y cilindros se calculan como área de base por altura. Si conoces el volumen, despeja la dimensión que falta. En objetos reales deja margen: un depósito no suele llenarse hasta el borde.","La semejanza conserva ángulos y produce lados proporcionales. Las áreas cambian con el cuadrado del factor de escala y los volúmenes con el cubo.","Siempre escribe el resultado con unidades cúbicas y comprueba si la magnitud es razonable."]]],"rules":["Prisma: V=A_base·h","Cilindro: V=πr²h","1 L=1 dm³=1.000 cm³","Factor k: áreas k²; volúmenes k³"],"examples":[["Cilindro","120 L=120.000 cm³. Con diámetro 70 cm, r=35. h=120.000/(π·35²)≈31,2 cm."],["Capacidad","Caja 40×30×25 cm: V=30.000 cm³=30 L."]],"mistakes":["Convertir 120 L en 120 cm³.","Olvidar elevar el radio al cuadrado.","Dar cm² en un volumen."],"exam":"Se integra con tecnología, química y medio ambiente: reactores, depósitos, movimientos de tierra y consumo de agua.","exercises":["Volumen de un prisma 6×4×2,5 m.","Cilindro r=2 m, h=5 m.","Convierte 0,75 m³ a litros.","Un cubo duplica su arista. ¿Por cuánto cambia el volumen?","Depósito cilíndrico de 500 L y radio 0,4 m: calcula altura."],"solutions":["60 m³.","20π≈62,83 m³.","750 L.","Por 2³=8.","500 L=0,5 m³; h=0,5/(π·0,4²)≈0,995 m."],"checklist":["Convierto antes de sustituir.","Uso unidades cúbicas.","Sé despejar una dimensión."]},{"title":"Estadística y probabilidad","goals":["Datos: distinguir población, muestra y variable","Centralización: calcular media, mediana y moda","Gráficos: elegir e interpretar","Probabilidad: usar complementario e independencia"],"sections":[["Explicación desde cero",["La población es el conjunto que se quiere estudiar; la muestra, la parte observada. Una variable puede ser cualitativa o cuantitativa, y esta última discreta o continua.","La media suma y divide por el número de datos; la mediana ocupa el centro tras ordenar; la moda es el valor más frecuente. La media es sensible a valores extremos, la mediana mucho menos.","Barras comparan categorías; histograma agrupa intervalos continuos; sectores muestran composición; líneas, evolución temporal. Lee título, fuente, ejes, unidades y escala antes de concluir.","La probabilidad va de 0 a 1. El complementario vale 1−P(A). Si sucesos independientes deben ocurrir a la vez, se multiplican sus probabilidades. No multipliques si no hay independencia."]]],"rules":["Media=Σx/n","P(no A)=1−P(A)","Independientes: P(A y B)=P(A)·P(B)"],"examples":[["Mediana","Datos 2,3,3,7,15: media=6; mediana=3; moda=3. El 15 arrastra la media."],["Complementario","Defecto 30 %: sin defecto 70 %. Tres piezas independientes sin defecto 0,7·0,8·0,9=0,504=50,4 %."]],"mistakes":["Calcular mediana sin ordenar.","Confundir 0,2 con 0,2 %.","Sumar probabilidades cuando deben ocurrir a la vez.","Leer un gráfico sin comprobar si el eje empieza en cero."],"exam":"Es uno de los bloques más repetidos: calcular medidas, justificar afirmaciones y representar una tabla. Las opciones erróneas pueden restar puntos.","exercises":["Media, mediana y moda de 4,5,5,6,10.","En una bolsa hay 3 rojas y 7 azules. P(roja).","P(lluvia)=0,25. P(no lluvia).","Dos componentes independientes fallan con 0,1 y 0,2. P(ninguno falla).","Una encuesta puntúa 2,4,4,5,5,5,8. Decide qué medida representa mejor el centro y justifica."],"solutions":["Media 6; mediana 5; moda 5.","3/10=0,3=30 %.","0,75=75 %.","0,9·0,8=0,72=72 %.","Mediana y moda son 5; la media es 33/7≈4,71. El 8 eleva algo la media, por lo que 5 representa bien la puntuación típica."],"checklist":["Ordeno antes de hallar mediana.","Interpreto escalas y unidades.","Uso complementario e independencia."]}],"questions":[{"id":"matematicas-r-0-0","chapter":0,"type":"mcq","prompt":"¿Qué regla o relación corresponde al tema «Números, signos y jerarquía de operaciones»?","options":["a − b = a + (−b)","Pendiente m=(y₂−y₁)/(x₂−x₁)","(aᵐ)ⁿ=aᵐⁿ","a/b + c/d = (ad+bc)/bd"],"answer":0,"explanation":"La relación correcta es a − b = a + (−b). Suele estar escondido dentro de precios, temperaturas, desniveles o cálculos científicos. Se puntúa el procedimiento y el resultado con unidad cuando procede."},{"id":"matematicas-r-0-1","chapter":0,"type":"mcq","prompt":"¿Qué regla o relación corresponde al tema «Números, signos y jerarquía de operaciones»?","options":["(−)·(−)=+; (+)·(−)=−","Prisma: V=A_base·h","sin=op/hip; cos=ady/hip; tan=op/ady","Triángulo: A=bh/2"],"answer":0,"explanation":"La relación correcta es (−)·(−)=+; (+)·(−)=−. Suele estar escondido dentro de precios, temperaturas, desniveles o cálculos científicos. Se puntúa el procedimiento y el resultado con unidad cuando procede."},{"id":"matematicas-r-0-2","chapter":0,"type":"mcq","prompt":"¿Qué regla o relación corresponde al tema «Números, signos y jerarquía de operaciones»?","options":["Paréntesis → potencias/raíces → ×/÷ → +/−","√(a²)=|a|","aᵐ/aⁿ=aᵐ⁻ⁿ","Rectángulo: A=bh"],"answer":0,"explanation":"La relación correcta es Paréntesis → potencias/raíces → ×/÷ → +/−. Suele estar escondido dentro de precios, temperaturas, desniveles o cálculos científicos. Se puntúa el procedimiento y el resultado con unidad cuando procede."},{"id":"matematicas-m-0-0","chapter":0,"type":"mcq","prompt":"¿Es correcta esta afirmación? Hacer primero una suma porque aparece antes a la izquierda, ignorando la jerarquía.","options":["No: describe un error frecuente","Sí: es la regla general","Solo si se ignoran las unidades","No se puede saber"],"answer":0,"explanation":"Es uno de los errores que debes evitar. Revisa: a − b = a + (−b)"},{"id":"matematicas-m-0-1","chapter":0,"type":"mcq","prompt":"¿Es correcta esta afirmación? Confundir −3² con (−3)²: el primero es −9 y el segundo 9.","options":["No: describe un error frecuente","Sí: es la regla general","Solo si se ignoran las unidades","No se puede saber"],"answer":0,"explanation":"Es uno de los errores que debes evitar. Revisa: a − b = a + (−b)"},{"id":"matematicas-m-0-2","cha ón desde cero",["Medir es comparar una magnitud con una unidad. Longitud, masa, tiempo y temperatura son magnitudes; metro, kilogramo, segundo y kelvin son unidades. Escribir solo '12' deja la respuesta incompleta.","El SI usa m, kg, s, K, A y otras unidades básicas. Velocidad se expresa en m/s; fuerza en newtons; energía en julios; potencia en vatios. Los prefijos cambian por potencias de diez: kilo=10³, centi=10⁻², mili=10⁻³.","Un factor de conversión es una fracción equivalente a 1. Se coloca para cancelar la unidad antigua. En superficies y volúmenes el factor se eleva al cuadrado o al cubo.","Conserva cifras durante las operaciones y redondea al final. Una respuesta con exceso de decimales aparenta una precisión que los datos no tienen."]]],"rules":["1 m/s=3,6 km/h","1 L=10⁻³ m³","1 kWh=3,6·10⁶ J"],"examples":[["Velocidad","72 km/h·(1.000 m/1 km)·(1 h/3.600 s)=20 m/s."],["Volumen","250 mL·(1 L/1.000 mL)=0,250 L."]],"mistakes":["Cambiar el número sin cancelar unidades.","Usar gramos en una fórmula que requiere kg.","Redondear en cada paso."],"exam":"Las conversiones aparecen dentro de casi todos los problemas. La pauta de 2026 descontaba por unidad ausente o incorrecta.","exercises":["Convierte 90 km/h a m/s.","Convierte 0,35 kg a g.","Convierte 2,4 L a cm³.","Convierte 750 W a kW.","Un móvil recorre 1,5 m a 4 cm/s. Halla el tiempo."],"solutions":["25 m/s.","350 g.","2.400 cm³.","0,75 kW.","1,5 m=150 cm; t=150/4=37,5 s."],"checklist":["Escribo siempre unidad.","Cancelo unidades con factores.","Redondeo solo al final."]},{"title":"Movimiento: posición, velocidad y aceleración","goals":["Movimiento: elegir sistema de referencia","Velocidad: relacionar espacio y tiempo","Aceleración: interpretar cambio de velocidad","Gráficas: leer x-t y v-t"],"sections":[["Explicación desde cero",["El movimiento depende del sistema de referencia. Posición indica dónde está el móvil; desplazamiento es posición final menos inicial; distancia es longitud total recorrida y nunca negativa.","La velocidad media es desplazamiento dividido por tiempo. En movimiento rectilíneo uniforme la velocidad es constante y la posición cambia linealmente. Rapidez usa distancia y no informa de dirección.","Aceleración mide cuánto cambia la velocidad por segundo. Puede existir aceleración porque cambia el módulo o la dirección. Frenar produce aceleración contraria al movimiento.","En gráfica posición-tiempo, la pendiente es velocidad. En velocidad-tiempo, la pendiente es aceleración y el área bajo la gráfica representa desplazamiento."]]],"rules":["v=Δx/Δt","a=Δv/Δt","MRU: x=x₀+vt"],"examples":[["Trayecto","150 km en 2,5 h: rapidez media 60 km/h."],["Aceleración","De 5 a 17 m/s en 4 s: a=(17−5)/4=3 m/s²."]],"mistakes":["Confundir distancia y desplazamiento.","Mezclar km con segundos.","Decir que velocidad constante implica posición constante."],"exam":"Suele combinarse con conversiones, gráficas y contextos tecnológicos. Explica el significado físico, no solo el número.","exercises":["300 m en 50 s: velocidad.","Un coche va a 20 m/s durante 15 s: distancia.","Pasa de 72 km/h a 0 en 5 s: aceleración.","Describe una gráfica x-t horizontal.","Un ascensor sube 1,5 m a 4 cm/s. Tiempo."],"solutions":["6 m/s.","300 m.","72 km/h=20 m/s; a=(0−20)/5=−4 m/s².","La posición no cambia: está en reposo.","37,5 s."],"checklist":["Convierto unidades.","Interpreto el signo de a.","Leo pendiente con sentido físico."]},{"title":"Fuerzas, equilibrio y leyes de Newton","goals":["Fuerza: representarla como vector","Equilibrio: reconocer resultante cero","Newton: relacionar fuerza, masa y aceleración","Peso: no confundirlo con masa"],"sections":[["Explicación desde cero",["Una fuerza puede cambiar el movimiento o deformar un cuerpo. Es vectorial: importa módulo, dirección y sentido. El diagrama de cuerpo libre aísla el objeto y dibuja las fuerzas que actúan sobre él.","Primera ley: si la fuerza resultante es cero, el cuerpo permanece en reposo o con velocidad constante. Equilibrio no significa ausencia de fuerzas, sino compensación.","Segunda ley: la resultante produce aceleración, F=m·a. Con la misma fuerza, mayor masa implica menor aceleración. Tercera ley: las fuerzas de acción y reacción son iguales y opuestas, pero actúan sobre cuerpos distintos.","Masa mide materia en kg. Peso es fuerza gravitatoria P=m·g en N. Sobre una mesa horizontal sin aceleración vertical, la normal compensa el peso."]]],"rules":["ΣF=m·a","Peso P=m·g","Equilibrio: ΣF=0"],"examples":[["Masa soportada","Motor 343 N eleva mecanismo 0,7 kg y TV. Peso mecanismo=6,86 N; fuerza disponible=336,14 N; masa TV=336,14/9,8≈34,3 kg."],["Equilibrio","Empuje 5 N a la derecha exige una fuerza horizontal 5 N a la izquierda para que ΣF=0; normal y peso también se compensan."]],"mistakes":["Llamar kilogramos al peso.","Dibujar acción y reacción sobre el mismo cuerpo.","Sumar fuerzas opuestas sin signo."],"exam":"Los diagramas y las justificaciones dan puntos parciales. En 2026 se pidió dibujar fuerzas de equilibrio y calcular masa máxima.","exercises":["Peso de 12 kg con g=9,8.","Fuerza neta 30 N sobre 6 kg: aceleración.","Caja con 50 N derecha y 35 N izquierda: resultante.","¿Qué fuerzas verticales actúan sobre un libro quieto en mesa?","Un ascensor de 500 kg acelera 1 m/s² hacia arriba. Resultante."],"solutions":["117,6 N.","5 m/s².","15 N a la derecha.","Peso hacia abajo y normal hacia arriba, iguales.","ΣF=ma=500 N hacia arriba; la tensión supera al peso en 500 N."],"checklist":["Dibujo vectores con sentido.","Distingo masa y peso.","Compruebo si hay equilibrio."]},{"title":"Trabajo, energía y potencia","goals":["Trabajo: relacionar fuerza y desplazamiento","Energía: reconocer cinética y potencial","Conservación: seguir transformaciones","Potencia: medir rapidez de transferencia"],"sections":[["Explicación desde cero",["El trabajo mecánico transfiere energía cuando una fuerza provoca desplazamiento. Si fuerza y movimiento son paralelos, W=F·d. Sin desplazamiento no hay trabajo mecánico aunque exista esfuerzo fisiológico.","Energía cinética depende de masa y velocidad; potencial gravitatoria, de masa y altura. Al caer sin rozamiento, potencial se transforma en cinética y la energía mecánica se conserva.","La potencia indica energía o trabajo por unidad de tiempo. Dos máquinas pueden hacer el mismo trabajo; la más potente tarda menos.","En situaciones reales parte de la energía se disipa como calor, sonido o deformación. La eficiencia compara energía útil con energía aportada."]]],"rules":["W=F·d","Ec=½mv²","Ep=mgh","P=W/t=E/t","η=Eútil/Eentrada·100"],"examples":[["Caída","Objeto 0,4 kg a 1,5 m: Ep=0,4·9,8·1,5=5,88 J."],["Protector","Si reduce 60 %, queda 40 %: impacto=5,88·0,40=2,352 J."]],"mistakes":["Restar 60 a una energía en lugar de aplicar 60 %.","Usar altura en cm con g en m/s².","Confundir potencia con energía."],"exam":"Aparece con caídas, aparatos eléctricos y eficiencia. Se valora comparar el resultado con un umbral y concluir.","exercises":["Ep de 2 kg a 3 m.","Ec de 4 kg a 5 m/s.","Trabajo de 80 N durante 6 m.","Máquina hace 1.200 J en 20 s: potencia.","Dispositivo recibe 500 J y entrega 375 J útiles: eficiencia."],"solutions":["58,8 J.","0,5·4·25=50 J.","480 J.","60 W.","375/500·100=75 %."],"checklist":["Identifico tipo de energía.","Aplico porcentajes a la energía.","Concluyo con criterio físico."]},{"title":"Temperatura, calor y cambios de estado","goals":["Temperatura: relacionarla con agitación de partículas","Calor: entender transferencia de energía","Cambios de estado: interpretar sin cambio de composición","Transferencia: conducción, convección y radiación"],"sections":[["Explicación desde cero",["Temperatura mide el estado térmico relacionado con la energía cinética media de las partículas. Calor es energía que se transfiere por diferencia de temperatura; un cuerpo no 'contiene calor'.","Al calentar, la temperatura suele aumentar, salvo durante un cambio de estado, donde la energía separa partículas. Fusión, solidificación, vaporización, condensación, sublimación y deposición son cambios físicos.","Conducción domina en sólidos por contacto; convección implica movimiento de fluidos; radiación viaja mediante ondas electromagnéticas y no necesita materia.","El equilibrio térmico se alcanza cuando dos cuerpos en contacto llegan a la misma temperatura y deja de haber transferencia neta."]]],"rules":["Q=m·c·ΔT","K=°C+273,15","Durante cambio de estado puro, T permanece constante"],"examples":[["Calentar agua","0,5 kg de agua, c=4.180 J/(kg·°C), de 20 a 30 °C: Q=0,5·4180·10=20.900 J."],["Mecanismos","El Sol calienta por radiación; una cuchara metálica, por conducción; el agua de una olla circula por convección."]],"mistakes":["Confundir temperatura y calor.","Usar temperatura final en vez de ΔT.","Pensar que evaporar crea otra sustancia."],"exam":"Puede aparecer ligado a energía doméstica, clima, aislamiento o estados de la materia.","exercises":["Convierte 25 °C a K.","¿Qué transferencia domina en una sartén?","Calcula Q para 2 kg, c=500, ΔT=8 °C.","Nombre del paso gas→líquido.","¿Por qué hierve el agua sin subir de temperatura durante el cambio?"],"solutions":["298,15 K.","Conducción.","8.000 J.","Condensación.","La energía se emplea en vencer interacciones y cambiar de estado, no en aumentar la agitación media."],"checklist":["Uso ΔT.","Distingo mecanismos.","Reconozco cambios físicos."]},{"title":"Electricidad y circuitos","goals":["Carga y corriente: comprender flujo eléctrico","Tensión y resistencia: interpretar su relación","Circuitos: distinguir serie y paralelo","Consumo: calcular energía y coste"],"sections":[["Explicación desde cero",["La corriente es movimiento ordenado de carga y se mide en amperios. La tensión es energía por unidad de carga y se mide en voltios. La resistencia dificulta el paso de corriente y se mide en ohmios.","La ley de Ohm relaciona V, I y R en componentes óhmicos. En serie circula la misma corriente y las resistencias se suman; en paralelo todos los ramales tienen la misma tensión y funcionan de forma independiente.","Potencia eléctrica indica la rapidez con que un aparato transforma energía. El consumo facturado es energía en kWh: potencia en kW por tiempo en horas.","Un circuito necesita generador, conductores, receptor y control. Fusibles y magnetotérmicos protegen; la toma de tierra deriva corrientes peligrosas."]]],"rules":["V=I·R","P=V·I","E=P·t","Coste=kWh·€/kWh"],"examples":[["Ley de Ohm","12 V y 6 Ω: I=12/6=2 A."],["Coste","PC 300 W durante 5 h: 0,3 kW·5 h=1,5 kWh. A 0,15 €/kWh cuesta 0,225 €."]],"mistakes":["Calcular kWh usando W sin dividir por 1.000.","Dibujar dos lámparas en serie cuando se pide control independiente.","Confundir corriente con tensión."],"exam":"El modelo 2026 pidió esquema en paralelo, símbolos, nombres, consumo y coste. Los componentes y conexiones aportaban puntuación parcial.","exercises":["10 V y 5 Ω: intensidad.","230 V y 2 A: potencia.","Lámpara 60 W, 4 h/día: kWh diario.","Coste anterior a 0,20 €/kWh durante 30 días.","¿Por qué las luces domésticas se conectan en paralelo?"],"solutions":["2 A.","460 W.","0,06·4=0,24 kWh.","0,24·30·0,20=1,44 €.","Cada receptor recibe la tensión de red y puede funcionar aunque otro se apague o falle."],"checklist":["Paso W a kW.","Aplico Ohm y potencia.","Dibujo serie/paralelo."]},{"title":"Materia, átomo y tabla periódica","goals":["Materia: describir propiedades y estados","Átomo: identificar partículas","Elemento: interpretar Z y A","Tabla periódica: reconocer grupos y tendencias básicas"],"sections":[["Explicación desde cero",["La materia tiene masa y ocupa volumen. Sólido, líquido y gas se explican por disposición, movimiento y fuerzas entre partículas. El modelo cinético ayuda a interpretar presión, difusión y cambios de estado.","El átomo contiene protones positivos y neutrones en el núcleo, y electrones negativos alrededor. Número atómico Z es protones; en átomo neutro también electrones. Número másico A es protones+neutrones.","Isótopos tienen igual Z y distinto número de neutrones. Un ion pierde o gana electrones: catión positivo al perder, anión negativo al ganar.","La tabla ordena por Z. Los elementos de un grupo comparten propiedades por electrones externos. Metales predominan a la izquierda; no metales, a la derecha; gases nobles son poco reactivos."]]],"rules":["Z=p","A=p+n","Átomo neutro: p=e","Ion: carga=p−e"],"examples":[["Partículas","Na con Z=11 y A=23: 11 protones, 12 neutrones, 11 electrones si es neutro."],["Ion","Cl⁻ con Z=17 tiene 17 protones y 18 electrones."]],"mistakes":["Creer que neutrones determinan el elemento.","Sumar electrones para obtener A.","Confundir compuesto con mezcla."],"exam":"Puede aparecer mediante etiquetas, fórmulas, clasificación de sustancias y contexto ambiental o tecnológico.","exercises":["C: Z=6, A=14. p,n,e neutro.","Mg²⁺ con Z=12: electrones.","Define isótopo.","Clasifica hierro, oxígeno y neón como metal/no metal/gas noble.","Explica por partículas por qué un gas se comprime."],"solutions":["6 p, 8 n, 6 e.","10 electrones.","Átomos del mismo elemento con igual Z y distinto número de neutrones.","Hierro metal; oxígeno no metal; neón gas noble.","Hay mucho espacio entre partículas y puede reducirse al aplicar presión."],"checklist":["Uso Z y A.","Distingo átomo e ion.","Relaciono estado con partículas."]},{"title":"Sustancias, mezclas y disoluciones","goals":["Sustancia pura: distinguir elemento y compuesto","Mezcla: reconocer homogénea y heterogénea","Separación: elegir técnica","Concentración: calcular g/L y porcentajes"],"sections":[["Explicación desde cero",["Una sustancia pura tiene composición fija. Un elemento contiene un solo tipo de átomo; un compuesto, elementos unidos químicamente en proporción fija. Una mezcla conserva las sustancias y su proporción puede variar.","En mezcla homogénea no se distinguen fases; una disolución tiene soluto y disolvente. En heterogénea sí hay fases o componentes diferenciables.","La técnica depende de propiedades: filtración separa sólido insoluble; decantación, fases de distinta densidad; destilación, puntos de ebullición; cromatografía, afinidades; evaporación recupera sólido disuelto.","Concentración g/L divide masa de soluto entre volumen de disolución en litros. En porcentaje masa, compara masas; en porcentaje volumen, volúmenes."]]],"rules":["c(g/L)=m_soluto/V_disolución","%m/m=m_soluto/m_disolución·100"],"examples":[["Preparación","130 g/L y 250 mL=0,250 L: m=cV=32,5 g."],["Sedimento","Si queda sólido visible, la mezcla es heterogénea; se separa por filtración."]],"mistakes":["Usar mL directamente en g/L.","Llamar disolución a cualquier mezcla.","Elegir filtración para sal disuelta."],"exam":"Muy frecuente en modelos: preparar disoluciones, clasificar mezcla y explicar procedimiento de separación.","exercises":["20 g en 0,5 L: g/L.","Masa para 2 L a 15 g/L.","Técnica para arena+agua.","Técnica para alcohol+agua.","Disolución 10 g sal+90 g agua: %m/m."],"solutions":["40 g/L.","30 g.","Filtración, tras sedimentar si conviene.","Destilación fraccionada por distintos puntos de ebullición.","Masa total 100 g; 10 %."],"checklist":["Convierto volumen a L.","Justifico la técnica.","Distingo soluto, disolvente y disolución."]},{"title":"Cambios químicos y reacciones","goals":["Reacción: distinguir reactivos y productos","Conservación: ajustar ecuaciones sencillas","Velocidad: reconocer factores y catalizadores","Química cotidiana: interpretar combustión, oxidación y ácidos"],"sections":[["Explicación desde cero",["En cambio físico no aparecen sustancias nuevas; en cambio químico se reorganizan átomos y se forman productos. Indicadores: gas, precipitado, cambio térmico o color, aunque deben interpretarse con cuidado.","Una ecuación muestra reactivos a la izquierda y productos a la derecha. Ajustar consiste en colocar coeficientes para conservar cada tipo de átomo; nunca se cambian subíndices de las fórmulas.","La velocidad aumenta con temperatura, concentración, superficie de contacto y catalizadores. Un catalizador ofrece una ruta más fácil, acelera y se recupera al final; no cambia el balance global.","Combustión completa de hidrocarburos produce CO₂ y H₂O y libera energía. Oxidación del hierro requiere condiciones ambientales. Ácidos y bases se describen con pH: menor de 7 ácido, 7 neutro, mayor de 7 básico."]]],"rules":["Átomos de cada elemento: iguales antes y después","Catalizador: acelera sin consumirse","pH<7 ácido; pH=7 neutro; pH>7 base"],"examples":[["Ajuste","H₂+O₂→H₂O. Para conservar oxígeno: 2H₂+O₂→2H₂O."],["Catalizador","Si CuCl acelera diez veces y se recupera, actúa como catalizador."]],"mistakes":["Cambiar H₂O a H₂O₂ para ajustar.","Confundir coeficiente 2H₂O con subíndice.","Decir que el catalizador aporta reactivos."],"exam":"Los modelos piden identificar reactivos/productos, escribir reacciones con palabras, reconocer catalizador y corrosión.","exercises":["Reactivos y productos en carbono+oxígeno→CO₂.","Ajusta N₂+H₂→NH₃.","¿Cambio físico o químico: derretir hielo?","¿Qué hace aumentar la velocidad: bajar temperatura o triturar sólido?","pH 3, 7 y 11: clasifica."],"solutions":["Reactivos carbono y oxígeno; producto dióxido de carbono.","N₂+3H₂→2NH₃.","Físico: sigue siendo H₂O.","Triturar aumenta superficie y velocidad.","Ácido, neutro y básico."],"checklist":["Ajusto con coeficientes.","Distingo físico/químico.","Explico catalizador y factores."]}],"questions":[{"id":"fisica_quimica-r-0-0","chapter":0,"type":"mcq","prompt":"¿Qué regla o relación corresponde al tema «Medida, Sistema Internacional y conversiones»?","options":["1 m/s=3,6 km/h","Equilibrio: ΣF=0","pH<7 ácido; pH=7 neutro; pH>7 base","c(g/L)=m_soluto/V_disolución"],"answer":0,"explanation":"La relación correcta es 1 m/s=3,6 km/h. Las conversiones aparecen dentro de casi todos los problemas. La pauta de 2026 descontaba por unidad ausente o incorrecta."},{"id":"fisica_quimica-r-0-1","chapter":0,"type":"mcq","prompt":"¿Qué regla o relación corresponde al tema «M ","subtitle":"Vida, salud, genética, ecosistemas y dinámica terrestre para el examen competencial","color":"#059669","domain":"ámbito científico-tecnológico (3 horas)","sourceNote":"La prueba reciente insiste en salud, células, genética, ecosistemas, contaminación, cambio climático, dinámica terrestre y lectura de esquemas científicos.","examWeight":"El ámbito científico-tecnológico 2/2026 contiene cinco actividades de 13, 24, 13, 28 y 22 puntos; las materias aparecen mezcladas.","chapters":[{"title":"La célula y la organización de los seres vivos","goals":["Célula: reconocerla como unidad de vida","Tipos: comparar procariota, animal y vegetal","Orgánulos: relacionar estructura y función","Organización: célula-tejido-órgano-sistema"],"sections":[["Explicación desde cero",["La célula es la unidad estructural y funcional mínima capaz de realizar nutrición, relación y reproducción. La teoría celular afirma que todos los seres vivos están formados por células y que toda célula procede de otra.","Procariotas no tienen núcleo membranoso; su ADN está en el citoplasma. Eucariotas sí tienen núcleo y orgánulos. Las vegetales poseen pared celular, cloroplastos y gran vacuola; las animales no.","La membrana regula intercambios; núcleo almacena ADN; mitocondria obtiene energía; ribosoma fabrica proteínas; cloroplasto realiza fotosíntesis; vacuola almacena; pared da rigidez.","En pluricelulares, células semejantes forman tejidos; tejidos, órganos; órganos coordinados, aparatos o sistemas; todos forman el organismo."]]],"rules":["Célula → tejido → órgano → aparato/sistema → organismo","Fotosíntesis: materia inorgánica + luz → materia orgánica + O₂","Respiración celular: nutrientes + O₂ → energía + CO₂ + H₂O"],"examples":[["Identificación","Una célula con núcleo, pared y cloroplastos es vegetal eucariota."],["Función","Una célula muscular tiene muchas mitocondrias porque necesita gran cantidad de energía."]],"mistakes":["Creer que las plantas no respiran.","Confundir pared celular con membrana.","Asignar cloroplastos a todas las células vegetales, incluidas raíces no verdes."],"exam":"Puede pedir etiquetar dibujos, emparejar orgánulos o explicar diferencias funcionales. Las respuestas incorrectas en selección múltiple pueden restar.","exercises":["Tres ideas de la teoría celular.","Diferencia esencial procariota/eucariota.","Función de membrana, núcleo y mitocondria.","Ordena: órgano, célula, organismo, tejido.","Explica por qué una hoja tiene cloroplastos y una raíz suele no tenerlos."],"solutions":["Todos los seres vivos tienen células; la célula es unidad básica; toda célula viene de otra.","Presencia de núcleo membranoso en eucariotas.","Regula intercambio; guarda ADN; obtiene energía.","Célula→tejido→órgano→organismo.","La hoja capta luz y fotosintetiza; la raíz subterránea no recibe luz y se especializa en absorción."],"checklist":["Reconozco imágenes celulares.","Relaciono orgánulo y función.","Explico niveles de organización."]},{"title":"Nutrición humana y aparatos digestivo, respiratorio, circulatorio y excretor","goals":["Nutrientes: distinguir función energética, plástica y reguladora","Digestión: seguir alimento hasta nutrientes","Intercambio: conectar respiración y circulación","Excreción: entender riñón y homeostasis"],"sections":[["Explicación desde cero",["Nutrirse no es solo comer: consiste en obtener materia y energía y eliminar residuos. Glúcidos y grasas aportan energía; proteínas construyen y reparan; vitaminas, minerales y agua regulan.","La digestión transforma alimentos mecánica y químicamente. En intestino delgado se absorben nutrientes hacia sangre y linfa; en intestino grueso se recupera agua y se forman heces.","En alvéolos, O₂ pasa a sangre y CO₂ sale. La sangre transporta gases, nutrientes, hormonas y residuos. Corazón impulsa por circulación pulmonar y general; arterias salen del corazón y venas llegan.","Riñones filtran sangre, reabsorben sustancias útiles y producen orina. Mantienen agua, sales y pH dentro de rangos: homeostasis."]]],"rules":["Ventilación ≠ respiración celular","Arteria: sale del corazón; vena: llega","Orina: filtración + reabsorción + secreción"],"examples":[["Conexión","Tras comer, glucosa absorbida llega por sangre a células; con O₂ se usa en respiración celular para liberar energía."],["Circulación","Ventrículo derecho→arteria pulmonar→pulmones→venas pulmonares→aurícula izquierda."]],"mistakes":["Decir que todas las arterias llevan sangre oxigenada.","Confundir excreción con defecación.","Creer que digestión ocurre solo en estómago."],"exam":"Suele integrarse con hábitos saludables, etiquetas nutricionales, gráficos y casos de enfermedad.","exercises":["Función principal de glúcidos, proteínas y vitaminas.","Lugar principal de absorción.","Diferencia ventilación/respiración celular.","Recorrido del O₂ desde aire a una célula.","Por qué beber agua ayuda a función renal sin afirmar que 'limpia toxinas' mágicamente."],"solutions":["Energética; plástica; reguladora.","Intestino delgado.","Ventilación mueve aire; respiración celular libera energía en células.","Nariz/boca→tráquea→bronquios→alvéolos→sangre→corazón→tejidos.","El agua permite mantener volumen y concentración de líquidos y formar orina; los riñones regulan, no un producto detox."],"checklist":["Conecto los cuatro aparatos.","Interpreto hábitos con base biológica.","Evito mitos de salud."]},{"title":"Relación, sistema nervioso, endocrino y sentidos","goals":["Coordinación: comparar respuesta nerviosa y hormonal","Neurona: seguir impulso y sinapsis","Reflejo: reconocer arco reflejo","Sentidos: identificar partes básicas del ojo"],"sections":[["Explicación desde cero",["La función de relación capta estímulos, los procesa y genera respuesta. Receptores detectan; centros coordinadores integran; efectores, músculos o glándulas, responden.","El sistema nervioso actúa rápido y suele durar poco mediante impulsos. El endocrino libera hormonas a sangre, más lento y duradero. Ambos se coordinan para mantener homeostasis.","Un arco reflejo puede pasar de receptor a neurona sensitiva, médula, neurona motora y músculo antes de la percepción consciente. Es protector y rápido.","En el ojo, córnea protege y refracta; pupila regula entrada de luz; cristalino enfoca; retina transforma luz en impulsos mediante conos y bastones; nervio óptico lleva información."]]],"rules":["Estímulo → receptor → coordinador → efector → respuesta","Nervioso: rápido/breve; endocrino: lento/duradero"],"examples":[["Clasificación","Hipófisis, páncreas y adrenalina: endocrino. Médula, cerebelo y nervios motores: nervioso."],["Pantallas y sueño","La luz nocturna puede alterar señales que regulan melatonina; reducir luz y horario ayuda a higiene del sueño."]],"mistakes":["Decir que adrenalina solo pertenece al sistema nervioso.","Confundir pupila con lente.","Suponer que un reflejo no llega nunca al cerebro."],"exam":"El modelo 2026 pidió etiquetar el ojo y clasificar conceptos entre sistema nervioso y endocrino, además de proponer hábitos de sueño.","exercises":["Partes del arco reflejo.","Compara nervioso/endocrino.","Función de retina y cristalino.","Clasifica insulina, nervio motor, tiroides, médula.","Propón cuatro hábitos de higiene del sueño con justificación."],"solutions":["Receptor→sensitiva→médula→motora→efector.","Rápido y eléctrico frente a más lento, hormonal y duradero.","Retina transduce luz; cristalino enfoca.","Endocrino, nervioso, endocrino, nervioso.","Horario regular, menos pantallas/luz, evitar estimulantes tarde, ejercicio diurno y ambiente oscuro: favorecen ritmos y descanso."],"checklist":["Identifico partes del ojo.","Clasifico sistemas.","Argumento hábitos saludables."]},{"title":"Reproducción, mitosis y meiosis","goals":["Reproducción: distinguir sexual y asexual","Mitosis: relacionar crecimiento y reparación","Meiosis: explicar gametos y variabilidad","Salud sexual: conocer prevención básica"],"sections":[["Explicación desde cero",["La reproducción asexual usa un progenitor y produce descendencia muy semejante salvo mutaciones. La sexual une gametos y genera variabilidad por meiosis y fecundación.","Mitosis produce dos células con igual número de cromosomas y, normalmente, misma información. Permite crecimiento, renovación y reparación.","Meiosis produce cuatro células haploides a partir de una diploide, reduce cromosomas a la mitad y recombina información. La fecundación restaura el número diploide.","Métodos barrera reducen embarazo e infecciones; los hormonales previenen embarazo pero no ITS. Consentimiento, información y pruebas médicas forman parte de salud sexual."]]],"rules":["Mitosis: 1 célula → 2 iguales","Meiosis: 1 diploide → 4 haploides diferentes","Fecundación: n+n=2n"],"examples":[["Proceso","Formación de gametos y variabilidad: meiosis. Reparar piel: mitosis."],["Cromosomas","Si especie tiene 2n=46, gametos n=23; cigoto vuelve a 46."]],"mistakes":["Decir que meiosis sirve para crecer.","Afirmar que anticonceptivos hormonales previenen ITS.","Confundir embrión con gameto."],"exam":"En 2026 se pidió clasificar hechos como mitosis o meiosis con penalización por errores.","exercises":["Proceso para renovar intestino.","Proceso para formar óvulos.","Si 2n=18, ¿n?","Ventaja y coste de reproducción sexual.","Método que protege frente a ITS y por qué."],"solutions":["Mitosis.","Meiosis.","9.","Aumenta variabilidad y adaptación; requiere pareja/gametos y más energía/tiempo.","Preservativo/barrera porque reduce contacto con fluidos y mucosas; no elimina todo riesgo."],"checklist":["Diferencio mitosis/meiosis.","Interpreto n y 2n.","Respondo salud sexual sin mitos."]},{"title":"ADN, herencia y genética mendeliana","goals":["ADN y gen: relacionar información y rasgo","Genotipo/fenotipo: no confundir","Dominancia: resolver cruces sencillos","Probabilidad: interpretar cada descendiente"],"sections":[["Explicación desde cero",["El ADN almacena instrucciones. Un gen es un fragmento funcional; los alelos son versiones. Cromosomas contienen ADN y se heredan en pares, uno de cada progenitor.","Genotipo es combinación de alelos; fenotipo es rasgo observable influido por genotipo y ambiente. Dominante se expresa en heterocigosis; recesivo necesita dos copias en el modelo mendeliano simple.","Para un cruce, escribe genotipos, gametos posibles y cuadro de Punnett. Cuenta combinaciones genotípicas y fenotípicas.","El 50 % no significa que de cuatro crías exactamente dos deban tener el rasgo; cada nacimiento repite una probabilidad si los eventos son independientes."]]],"rules":["AA homocigoto dominante; Aa heterocigoto; aa homocigoto recesivo","Probabilidad=casos favorables/casos posibles"],"examples":[["Cruce","Aa blanco × aa gris: gametos A,a y a. Resultados Aa,aa al 50 %; fenotipos 50 % blanco, 50 % gris."],["Portadores","Dos Aa: 1/4 AA, 1/2 Aa, 1/4 aa; fenotipo dominante 3/4."]],"mistakes":["Asignar letras distintas a genes distintos sin definir.","Confundir alelo dominante con más frecuente o mejor.","Dar porcentaje sin cuadro o justificación."],"exam":"Muy probable: el modelo 2026 incluyó cruce monohíbrido, probabilidad y dominancia.","exercises":["Define gen, alelo, genotipo y fenotipo.","Cruza Bb×bb.","Cruza Aa×Aa: P(aa).","¿Puede un alelo recesivo ser frecuente?","Explica por qué hermanos pueden ser distintos."],"solutions":["Gen fragmento de ADN; alelo versión; genotipo combinación; fenotipo manifestación.","50 % Bb dominante, 50 % bb recesivo.","1/4=25 %.","Sí; dominancia describe expresión, no frecuencia ni valor adaptativo.","Reciben combinaciones distintas por meiosis, recombinación y fecundación al azar; además influye ambiente."],"checklist":["Monto cuadros de Punnett.","Distingo genotipo/fenotipo.","Interpreto probabilidad."]},{"title":"Evolución y selección natural","goals":["Evolución: entender cambio poblacional","Selección natural: aplicar variación-herencia-éxito","Adaptación: evitar explicaciones finalistas","Evidencias: reconocer fósiles, anatomía y ADN"],"sections":[["Explicación desde cero",["Las poblaciones evolucionan: cambian frecuencias de rasgos heredables a lo largo de generaciones. Los individuos no evolucionan durante su vida para necesitar algo.","La selección natural requiere variación, parte heredable y diferencias en supervivencia o reproducción. Quienes dejan más descendencia transmiten más sus variantes.","Una adaptación no aparece porque el organismo la quiera. Mutación y recombinación generan variación; el ambiente filtra. La selección no persigue perfección.","Fósiles, estructuras homólogas, distribución geográfica y semejanzas moleculares apoyan antepasados comunes."]]],"rules":["Variación heredable + presión ambiental + reproducción diferencial → cambio poblacional"],"examples":[["Migración de cigüeñas","Si no migrar mejora supervivencia y reproducción bajo inviernos suaves y recursos estables, variantes asociadas pueden aumentar con generaciones."],["Resistencia","Antibiótico no crea resistencia dirigida: sobreviven bacterias ya resistentes y se reproducen."]],"mistakes":["Decir que la selección crea la adaptación necesaria.","Confundir adaptación evolutiva con acostumbrarse individualmente.","Pensar que 'más fuerte' siempre significa más apto."],"exam":"El examen pide elegir afirmaciones correctas y penaliza marcar de más. Lee cada palabra: 'siempre', 'nunca' y 'completamente' suelen volver falsa una frase.","exercises":["Tres condiciones de selección natural.","Explica resistencia antibiótica.","¿Evoluciona un individuo?","Diferencia homología/analogía.","Aplica selección a aves con picos distintos tras sequía."],"solutions":["Variación, herencia y éxito reproductivo desigual.","Sobreviven resistentes preexistentes y aumentan su proporción.","No en sentido poblacional genético; cambia/desarrolla, pero evolución ocurre entre generaciones.","Homólogas comparten origen; análogas, función similar con origen distinto.","Si quedan semillas duras, aves con picos capaces de abrirlas sobreviven/reproducen más; el rasgo heredable aumenta."],"checklist":["No uso lenguaje finalista.","Aplico el mecanismo completo.","Detecto absolutos falsos."]},{"title":"Ecosistemas, redes tróficas y dinámica de poblaciones","goals":["Ecosistema: conectar biotopo y comunidad","Trofía: interpretar flechas y niveles","Población: explicar cambios por recursos","Biodiversidad: valorar invasoras y perturbaciones"],"sections":[["Explicación desde cero",["Un ecosistema integra factores abióticos y seres vivos con sus relaciones. Población son individuos de una especie; comunidad, todas las poblaciones.","Productores fabrican materia orgánica; consumidores la obtienen; descomponedores reciclan. La flecha suele ir del alimento al consumidor: muestra transferencia de materia y energía.","La energía disminuye en niveles por respiración y calor, por eso las cadenas suelen ser cortas. La materia se recicla en ciclos.","Una población crece rápido con recursos abundantes, se frena por competencia y puede estabilizarse cerca de capacidad de carga. Invasoras compiten, depredan, transmiten enfermedades y alteran redes."]]],"rules":["Productor → consumidor primario → secundario","Energía fluye; materia se recicla","Crecimiento logístico: rápido → lento → estable"],"examples":[["Red","Si baja fitoplancton, puede bajar zooplancton y después peces que dependen de él; justifica rutas alternativas."],["Invasora","No basta decir 'es mala': especifica competencia, depredación, enfermedad o alteración del hábitat."]],"mistakes":["Leer flechas al revés.","Afirmar una consecuencia segura cuando la red permite otros alimentos.","Confundir hábitat con nicho."],"exam":"El modelo 2026 usó una red fluvial, especies invasoras y una gráfica de crecimiento bacteriano. Se premia argumentar a partir del diagrama.","exercises":["Define población/comunidad.","Nivel trófico de una planta.","Consecuencia de perder un depredador superior.","Tres impactos de invasora.","Describe fases de curva logística."],"solutions":["Misma especie en área/tiempo; conjunto de poblaciones.","Productor.","Pueden aumentar presas y alterar niveles inferiores; depende de la red.","Competencia, depredación, enfermedades/pérdida biodiversidad.","Fase exponencial, desaceleración por límites y estabilización en capacidad de carga."],"checklist":["Leo redes sin memorizar una sola cadena.","Uso lenguaje probabilístico cuando toca.","Interpreto curvas."]},{"title":"Medio ambiente, recursos y cambio climático","goals":["Impacto: seguir causa-mecanismo-consecuencia","Contaminación: distinguir aire, agua y suelo","Clima: explicar efecto invernadero","Sostenibilidad: proponer medidas justificadas"],"sections":[["Explicación desde cero",["Un impacto ambiental se explica mejor como cadena: actividad→presión→cambio→efecto. Extraer minerales puede degradar hábitats; residuos electrónicos liberan metales; combustibles fósiles emiten gases.","El efecto invernadero natural mantiene temperatura habitable. El problema actual es su intensificación por CO₂, CH₄ y otros gases, que altera balance energético y clima.","Cambio climático no equivale al tiempo de un día. Sus efectos incluyen olas de calor, cambios de precipitación, subida del mar, acidificación y desplazamientos de especies.","Mitigación reduce causas; adaptación reduce daños. Desarrollo sostenible equilibra necesidades sociales, económicas y ambientales sin comprometer generaciones futuras."]]],"rules":["Mitigación: menos emisiones/más sumideros","Adaptación: prepararse para impactos","Reducir → reutilizar → reparar → reciclar"],"examples":[["Vertido","Metal pesado en río puede acumularse en organismos y aumentar en niveles tróficos; afecta reproducción y salud."],["Medida","Aislar vivienda reduce demanda energética: explica mecanismo y no solo 'ahorra'."]],"mistakes":["Decir que agujero de ozono causa directamente calentamiento.","Proponer reciclar como única solución.","Confundir clima con meteorología."],"exam":"Aparece transversalmente en científico y social: ODS, energía, residuos, agua y análisis de medidas.","exercises":["Diferencia mitigación/adaptación.","Explica efecto invernadero.","Cadena causal de residuo electrónico.","Renovable/no renovable con ejemplos.","Dos medidas personales y dos estructurales justificadas."],"solutions":["Reducir causa frente a reducir vulnerabilidad.","Gases absorben/reemiten infrarrojo y retienen más energía; el aumento antropogénico intensifica el efecto.","Mala gestión→lixiviado/metales→agua/suelo→bioacumulación→daño ecológico/salud.","Solar/eólica; carbón/petróleo/gas.","Menos coche y consumo duradero; transporte público y red eléctrica renovable. Deben explicar qué emisión/recurso reducen."],"checklist":["Construyo cadenas causales.","Distingo clima/tiempo.","Justifico soluciones."]},{"title":"Geología: Tierra, rocas, placas y riesgos","goals":["Capas terrestres: diferenciar modelo composicional y dinámico","Rocas: reconocer ciclo","Placas: explicar límites","Riesgo: relacionar peligro, exposición y vulnerabilidad"],"sections":[["Explicación desde cero",["Por composición: corteza, manto y núcleo. Por comportamiento: litosfera rígida, astenosfera dúctil y capas profundas. La litosfera está fragmentada en placas.","Rocas ígneas solidifican magma; sedimentarias acumulan y cementan sedimentos; metamórficas cambian por presión y temperatura sin fundirse. El ciclo conecta transformaciones.","Límites divergentes separan y crean litosfera; convergentes chocan y pueden subducir; transformantes deslizan. Sismos se concentran en límites, aunque también existen intraplaca.","Peligro es probabilidad/intensidad del fenómeno; riesgo incorpora exposición y vulnerabilidad. No se evita un terremoto, pero se reduce daño con normas, educación y planificación."]]],"rules":["Riesgo ≈ peligro × exposición × vulnerabilidad","Divergente: separa; convergente: acerca; transformante: desliza"],"examples":[["Sismo","Subducción acumula tensión; ruptura libera energía en ondas. Volcanismo y sismicidad suelen coincidir en zonas activas."],["Roca","Magma→enfriamiento→ígnea; meteorización→sedimentos→sedimentaria; presión/calor→metamórfica."]],"mistakes":["Afirmar que nunca hay sismos dentro de placas.","Confundir magma con lava.","Relacionar terremotos con clima."],"exam":"En 2026 hubo selección múltiple sobre sismos y placas. Marcar falsas restaba puntos.","exercises":["Capas composicionales.","Origen de las tres rocas.","Tipo de límite dorsal oceánica.","Tipo de límite fosa con subducción.","Dos medidas que reducen riesgo sísmico."],"solutions":["Corteza, manto, núcleo.","Solidificación; sedimentación/cementación; metamorfismo.","Divergente.","Convergente.","Construcción sismorresistente, planes y educación; reducen vulnerabilidad/exposición, no el peligro."],"checklist":["Relaciono límites y fenómenos.","Explico ciclo de rocas.","Distingo peligro y riesgo."]}],"questions":[{"id":"biologia_geologia-r-0-0","chapter":0,"type":"mcq","prompt":"¿Qué regla o relación corresponde al tema «La célula y la organización de los seres vivos»?","options":["Célula → tejido → órgano → aparato/sistema → organismo","Fecundación: n+n=2n","Mitosis: 1 célula → 2 iguales","Reducir → reutilizar → reparar → reciclar"],"answer":0,"explanation":"La relación correcta es Célula → tejido → órgano → aparato/sistema → organismo. Puede pedir etiquetar dibujos, emparejar orgánulos o explicar diferencias funcionales. Las respuestas incorrectas en selección múltiple pueden restar."},{"id":"biologia_geologia-r-0-1","chapter":0,"type":"mcq","prompt":"¿Qué regla o relación corresponde al tema «La célula y la organización de los seres vivos»?","options":["Fotosíntesis: materia inorgánica + luz → materia orgánica + O₂","Estímulo → receptor → coordinador → efector → respuesta","Riesgo ≈ peligro × exposición × vulnerabilidad","Mitosis: 1 célula → 2 iguales"],"answer":0,"explanation":"La relación correcta es Fotosíntesis: materia inorgánica + luz → materia orgánica + O₂. Puede pedir etiquetar dibujos, emparejar orgánulos o explicar difer
