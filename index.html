on":"Solar/eólica; carbón/petróleo/gas.","explanation":"Solar/eólica; carbón/petróleo/gas."},{"id":"biologia_geologia-o-7-4","chapter":7,"type":"open","prompt":"Dos medidas personales y dos estructurales justificadas.","solution":"Menos coche y consumo duradero; transporte público y red eléctrica renovable. Deben explicar qué emisión/recurso reducen.","explanation":"Menos coche y consumo duradero; transporte público y red eléctrica renovable. Deben explicar qué emisión/recurso reducen."},{"id":"biologia_geologia-r-8-0","chapter":8,"type":"mcq","prompt":"¿Qué regla o relación corresponde al tema «Geología: Tierra, rocas, placas y riesgos»?","options":["Riesgo ≈ peligro × exposición × vulnerabilidad","AA homocigoto dominante; Aa heterocigoto; aa homocigoto recesivo","Respiración celular: nutrientes + O₂ → energía + CO₂ + H₂O","Nervioso: rápido/breve; endocrino: lento/duradero"],"answer":0,"explanation":"La relación correcta es Riesgo ≈ peligro × exposición × vulnerabilidad. En 2026 hubo selección múltiple sobre sismos y placas. Marcar falsas restaba puntos."},{"id":"biologia_geologia-r-8-1","chapter":8,"type":"mcq","prompt":"¿Qué regla o relación corresponde al tema «Geología: Tierra, rocas, placas y riesgos»?","options":["Divergente: separa; convergente: acerca; transformante: desliza","Arteria: sale del corazón; vena: llega","Mitigación: menos emisiones/más sumideros","Ventilación ≠ respiración celular"],"answer":0,"explanation":"La relación correcta es Divergente: separa; convergente: acerca; transformante: desliza. En 2026 hubo selección múltiple sobre sismos y placas. Marcar falsas restaba puntos."},{"id":"biologia_geologia-m-8-0","chapter":8,"type":"mcq","prompt":"¿Es correcta esta afirmación? Afirmar que nunca hay sismos dentro de placas.","options":["No: describe un error frecuente","Sí: es la regla general","Solo si se ignoran las unidades","No se puede saber"],"answer":0,"explanation":"Es uno de los errores que debes evitar. Revisa: Riesgo ≈ peligro × exposición × vulnerabilidad"},{"id":"biologia_geologia-m-8-1","chapter":8,"type":"mcq","prompt":"¿Es correcta esta afirmación? Confundir magma con lava.","options":["No: describe un error frecuente","Sí: es la regla general","Solo si se ignoran las unidades","No se puede saber"],"answer":0,"explanation":"Es uno de los errores que debes evitar. Revisa: Riesgo ≈ peligro × exposición × vulnerabilidad"},{"id":"biologia_geologia-m-8-2","chapter":8,"type":"mcq","prompt":"¿Es correcta esta afirmación? Relacionar terremotos con clima.","options":["No: describe un error frecuente","Sí: es la regla general","Solo si se ignoran las unidades","No se puede saber"],"answer":0,"explanation":"Es uno de los errores que debes evitar. Revisa: Riesgo ≈ peligro × exposición × vulnerabilidad"},{"id":"biologia_geologia-o-8-0","chapter":8,"type":"open","prompt":"Capas composicionales.","solution":"Corteza, manto, núcleo.","explanation":"Corteza, manto, núcleo."},{"id":"biologia_geologia-o-8-1","chapter":8,"type":"open","prompt":"Origen de las tres rocas.","solution":"Solidificación; sedimentación/cementación; metamorfismo.","explanation":"Solidificación; sedimentación/cementación; metamorfismo."},{"id":"biologia_geologia-o-8-2","chapter":8,"type":"open","prompt":"Tipo de límite dorsal oceánica.","solution":"Divergente.","explanation":"Divergente."},{"id":"biologia_geologia-o-8-3","chapter":8,"type":"open","prompt":"Tipo de límite fosa con subducción.","solution":"Convergente.","explanation":"Convergente."},{"id":"biologia_geologia-o-8-4","chapter":8,"type":"open","prompt":"Dos medidas que reducen riesgo sísmico.","solution":"Construcción sismorresistente, planes y educación; reducen vulnerabilidad/exposición, no el peligro.","explanation":"Construcción sismorresistente, planes y educación; reducen vulnerabilidad/exposición, no el peligro."}],"pdf":"GESO_2026_biologia_geologia_COMPLETO.pdf"},{"key":"tecnologia","title":"Tecnología","subtitle":"Materiales, mecanismos, energía, electricidad, procesos y cultura digital","color":"#EA580C","domain":"ámbito científico-tecnológico (3 horas)","sourceNote":"Tecnología no forma un examen separado: se integra en el ámbito científico-tecnológico mediante mecanismos, estructuras, circuitos, consumo, procesos y decisiones de diseño.","examWeight":"El ámbito científico-tecnológico 2/2026 contiene cinco actividades de 13, 24, 13, 28 y 22 puntos; las materias aparecen mezcladas.","chapters":[{"title":"Proceso tecnológico y representación","goals":["Necesidad: definir el problema","Diseño: generar y comparar soluciones","Planificación: ordenar materiales, operaciones y seguridad","Evaluación: comprobar criterios y mejorar"],"sections":[["Explicación desde cero",["El proceso tecnológico parte de una necesidad real y termina con evaluación. Definir bien exige usuario, función, restricciones, coste, seguridad y sostenibilidad.","Durante diseño se hacen bocetos, croquis acotados, esquemas y prototipos. Un croquis comunica forma y medidas; un esquema comunica funcionamiento.","Planificar incluye lista de materiales, herramientas, operaciones, tiempo y riesgos. Construir sin plan genera desperdicio y fallos.","Evaluar no es decir 'funciona': se mide frente a criterios. Un prototipo que cumple función pero consume demasiado necesita iteración."]]],"rules":["Necesidad → investigación → ideas → diseño → planificación → construcción → prueba → mejora"],"examples":[["Proyecto","Mueble elevador: requisitos de carga, altura, velocidad, estabilidad, coste y seguridad; después mecanismo, planos, cálculo y ensayo."],["Criterio","'Debe elevar 34 kg en menos de 40 s' es medible; 'debe ser bueno' no."]],"mistakes":["Elegir una solución antes de definir requisitos.","Confundir dibujo decorativo con esquema funcional.","Omitir seguridad y final de vida."],"exam":"Las preguntas se integran con cálculos, lectura de esquemas y decisiones justificadas.","exercises":["Ordena las fases del proceso.","Tres requisitos medibles para una lámpara.","Diferencia croquis/esquema.","Qué incluir en planificación.","Cómo evaluarías una botella térmica."],"solutions":["Necesidad, investigación, diseño, planificación, construcción, prueba, mejora.","Iluminancia, consumo máximo, estabilidad/temperatura; con valor concreto.","Forma/medidas frente a funcionamiento/conexiones.","Materiales, herramientas, pasos, tiempo, seguridad y costes.","Medir pérdida de temperatura en tiempo, fugas, estabilidad y facilidad de uso."],"checklist":["Formulo criterios medibles.","Leo croquis y esquemas.","Incluyo seguridad/sostenibilidad."]},{"title":"Materiales y propiedades","goals":["Familias: reconocer metales, polímeros, madera, cerámica y compuestos","Propiedades: elegir por función","Ensayos: interpretar dureza, tenacidad y elasticidad","Ciclo de vida: valorar impacto"],"sections":[["Explicación desde cero",["Elegir material exige propiedades mecánicas, térmicas, eléctricas, químicas, coste y proceso. No existe 'el mejor' sin contexto.","Dureza resiste rayado; tenacidad resiste rotura por impacto; fragilidad rompe con poca deformación; elasticidad recupera forma; plasticidad conserva deformación; ductilidad permite hilos y maleabilidad láminas.","Metales suelen conducir y ser resistentes; polímeros son ligeros y aislantes; cerámicos resisten calor pero son frágiles; madera es renovable si se gestiona; compuestos combinan fases.","El ciclo de vida incluye extracción, fabricación, transporte, uso, reparación y fin de vida. Durabilidad y reparabilidad pueden pesar más que reciclabilidad teórica."]]],"rules":["Selección = función + propiedades + fabricación + coste + impacto"],"examples":[["Pantalla","Un protector necesita transparencia, dureza superficial y tenacidad; dureza sola no garantiza soportar golpes."],["Cable","Cobre conductor dentro; polímero aislante fuera. Cada capa responde a función distinta."]],"mistakes":["Confundir dureza con tenacidad.","Decir que plástico siempre contamina más sin analizar vida útil.","Elegir metal solo porque es resistente, ignorando masa/corrosión."],"exam":"Se piden relaciones material-propiedad-uso y razonamientos de sostenibilidad.","exercises":["Propiedad de un muelle.","Propiedad de casco contra golpes.","Material para aislante de cable.","Diferencia dúctil/maleable.","Compara botella desechable y reutilizable con ciclo de vida."],"solutions":["Elasticidad.","Tenacidad.","Polímero aislante.","Hilos frente a láminas.","La reutilizable tiene más impacto inicial pero lo reparte entre usos; conclusión depende de usos, lavado, transporte y fin de vida."],"checklist":["Distingo propiedades parecidas.","Justifico material por función.","Analizo ciclo de vida."]},{"title":"Máquinas simples y mecanismos","goals":["Máquina: entender ventaja mecánica","Palancas: identificar apoyo, potencia y resistencia","Transmisión: calcular relaciones","Transformación: reconocer biela-manivela, leva y tornillo"],"sections":[["Explicación desde cero",["Una máquina no crea energía: intercambia fuerza por distancia o cambia dirección. En ideal, trabajo de entrada y salida se iguala; el rozamiento reduce rendimiento.","Palanca equilibra momentos: fuerza por brazo. Primer género tiene apoyo entre fuerzas; segundo, resistencia en medio; tercero, potencia en medio.","Engranajes en contacto giran en sentidos contrarios; una rueda pequeña moviendo una grande reduce velocidad y aumenta par. Correas mantienen o invierten según montaje.","Biela-manivela transforma giro y vaivén; leva produce movimiento programado; tornillo transforma giro en avance y multiplica fuerza."]]],"rules":["F₁·d₁=F₂·d₂","i=n_entrada/n_salida=z_salida/z_entrada","η=salida/entrada·100"],"examples":[["Palanca","Carga 300 N a 0,2 m; esfuerzo a 0,8 m: F=300·0,2/0,8=75 N."],["Engranajes","Motriz 20 dientes a 120 rpm mueve 60 dientes: salida=120·20/60=40 rpm."]],"mistakes":["Creer que ventaja mecánica reduce trabajo ideal.","Invertir dientes en relación.","Olvidar sentido de giro."],"exam":"Aparece en objetos cotidianos, seguridad y esquemas. Dibuja y etiqueta antes de calcular.","exercises":["Género de balancín.","Género de carretilla.","Palanca: 500 N a 0,3 m y brazo esfuerzo 1,5 m.","Piñones 15 y 45, entrada 180 rpm: salida.","Mecanismo motor de pistón."],"solutions":["Primer género.","Segundo género.","100 N.","60 rpm.","Biela-manivela."],"checklist":["Etiqueto fuerzas/brazos.","Calculo relación y sentido.","No prometo energía gratis."]},{"title":"Estructuras y estabilidad","goals":["Esfuerzos: reconocer tracción, compresión, flexión, torsión y cortante","Estabilidad: relacionar base y centro de gravedad","Triangulación: explicar rigidez","Seguridad: usar factor de margen"],"sections":[["Explicación desde cero",["Una estructura soporta cargas y las transmite al terreno. Barras pueden trabajar a tracción o compresión; vigas a flexión; ejes a torsión; uniones a cortante.","Estabilidad mejora con base amplia, centro de gravedad bajo y proyección del centro dentro de la base. Si sale, vuelca.","El triángulo es rígido geométricamente; un cuadrilátero se deforma sin cambiar longitudes. Por eso cerchas usan triángulos.","Diseño seguro no trabaja justo al límite: usa factores para incertidumbre, desgaste y cargas dinámicas."]]],"rules":["Estable si proyección del centro de gravedad cae dentro de la base","Tensión≈F/A"],"examples":[["Televisor","Empuje horizontal puede volcar si el momento supera al estabilizador del peso; anclaje y base reducen riesgo."],["Puente","Triangulación reparte cargas en barras de tracción/compresión."]],"mistakes":["Confundir equilibrio de fuerzas con estabilidad frente a vuelco.","Afirmar que más material siempre es mejor.","No considerar carga dinámica."],"exam":"Puede pedir dibujar fuerzas, justificar estabilidad o reconocer esfuerzos en imágenes.","exercises":["Esfuerzo en cuerda.","Esfuerzo en columna.","Esfuerzo en estante cargado.","Dos formas de estabilizar mueble.","Por qué una cercha triangular es rígida."],"solutions":["Tracción.","Compresión.","Flexión.","Ampliar base/bajar centro/anclar.","Los lados fijan la forma; no se deforma sin cambiar longitud."],"checklist":["Reconozco cinco esfuerzos.","Distingo equilibrio/vuelco.","Justifico triangulación."]},{"title":"Electricidad, control y seguridad","goals":["Circuito: identificar componentes y símbolos","Serie/paralelo: predecir funcionamiento","Control: diseñar interruptores independientes","Protección: explicar riesgos eléctricos y de gas"],"sections":[["Explicación desde cero",["Un esquema eléctrico usa símbolos normalizados y conexiones, no apariencia real. Generador aporta tensión; receptor transforma; interruptor controla; conductor conecta.","En serie hay un solo camino; si un elemento abre, todos se paran. En paralelo hay ramales independientes con la misma tensión. Para dos ambientes independientes, cada lámpara lleva su interruptor en su ramal.","Sobrecarga y cortocircuito elevan corriente y calor. Fusible o magnetotérmico abre; diferencial detecta fuga; tierra reduce tensión de contacto.","Aparatos de combustión necesitan ventilación. Tapar rejillas puede acumular monóxido de carbono, gas tóxico sin olor, y crear riesgo grave."]]],"rules":["Ohm V=IR","Potencia P=VI","Dos receptores independientes → ramas en paralelo"],"examples":[["Diseño","Fuente común y dos ramales: interruptor+lámpara en cada uno; retornan a fuente."],["Seguridad gas","Ventilación no es adorno: evacua productos y aporta oxígeno; nunca se tapa."]],"mistakes":["Poner un interruptor común cuando se pide independencia.","Confiar en olor para detectar CO.","Manipular red eléctrica sin cortar suministro."],"exam":"En 2026 el circuito en paralelo, símbolos y nombre de componentes tenían puntuación separada; también apareció ventilación de gas.","exercises":["Dibuja verbalmente circuito de dos lámparas independientes.","Qué hace diferencial.","Diferencia sobrecarga/cortocircuito.","Por qué no tapar rejilla de gas.","12 V, resistencia 4 Ω: corriente."],"solutions":["Dos ramas paralelas, cada una con interruptor y lámpara.","Abre si detecta diferencia por fuga.","Exceso de receptores/corriente frente a unión de muy baja resistencia entre conductores.","Evita acumulación de CO y asegura combustión/evacuación.","3 A."],"checklist":["Uso símbolos y paralelo.","Conozco protecciones.","Prioridad absoluta a seguridad."]},{"title":"Energía, potencia, consumo y eficiencia","goals":["Fuente: distinguir primaria/secundaria y renovable/no renovable","Cadena energética: seguir transformaciones","Consumo: calcular kWh y coste","Eficiencia: comparar soluciones"],"sections":[["Explicación desde cero",["Fuentes primarias se obtienen de naturaleza; electricidad es vector secundario. Renovable se repone a ritmo humano, pero ninguna fuente carece de impacto.","Una cadena describe fuente→conversión→transporte→uso→pérdidas. En bombilla: energía eléctrica a luz y calor.","Potencia es ritmo de uso; energía es potencia por tiempo. Una plancha de 2 kW usada 0,5 h consume 1 kWh.","Eficiencia aumenta energía útil por entrada. También importa reducir demanda: aislamiento puede ahorrar antes que cambiar la fuente."]]],"rules":["E(kWh)=P(kW)·t(h)","Coste=E·tarifa","η=útil/entrada·100"],"examples":[["Estudio","60 W+300 W+50 W=410 W=0,410 kW; 5 h=2,05 kWh; a 0,15 € cuesta 0,3075 €."],["Ahorro","LED de 10 W sustituye 60 W durante 1.000 h: ahorra 50 kWh."]],"mistakes":["Sumar vatios y llamarlos kWh.","Decir renovable=sin impacto.","Comparar aparatos sin igualar servicio y horas."],"exam":"Es recurrente: tabla de aparatos, horas, tarifa y propuesta de medidas justificadas.","exercises":["1,5 kW por 3 h.","Coste a 0,18 €/kWh.","100 W, 8 h/día, 30 días: kWh.","Eficiencia si entran 800 J y salen 600 J.","Dos medidas para reducir gas y dos para electricidad."],"solutions":["4,5 kWh.","0,81 €.","0,1·8·30=24 kWh.","75 %.","Aislamiento/termostato; LED/apagar standby/equipos eficientes, con explicación de demanda."],"checklist":["Paso W a kW.","Calculo coste completo.","Diferencio potencia/energía."]},{"title":"Tecnología digital, datos y ciudadanía","goals":["Hardware/software: distinguir capas","Datos: entender codificación y almacenamiento","Redes: describir comunicación básica","Seguridad: aplicar contraseñas, copias y pensamiento crítico"],"sections":[["Explicación desde cero",["Hardware son componentes físicos; software son instrucciones y datos. Sistema operativo gestiona recursos; aplicaciones resuelven tareas. CPU procesa, RAM almacena temporalmente y almacenamiento conserva.","La información digital se codifica en bits. Un byte son 8 bits; prefijos de almacenamiento se usan a menudo en múltiplos decimales o binarios según contexto.","En una red, dispositivos intercambian paquetes mediante protocolos. Router conecta redes; dirección identifica; servidor ofrece servicios. Internet no es lo mismo que la web.","Seguridad incluye contraseñas únicas largas, gestor, doble factor, actualizaciones, copias 3-2-1 y cautela con enlaces. Veracidad exige fuente, fecha, evidencia y contraste."]]],"rules":["1 byte=8 bits","Copia 3-2-1: 3 copias, 2 soportes, 1 fuera","Dato ≠ información hasta interpretarlo"],"examples":[["Phishing","Urgencia+enlace+petición de credenciales: no entrar; abrir app oficial y verificar."],["Almacenamiento","Una foto de 4 MB: 250 fotos≈1.000 MB≈1 GB en aproximación decimal."]],"mistakes":["Creer que modo incógnito da anonimato total.","Reutilizar contraseña.","Compartir dato personal por autoridad aparente."],"exam":"Los modelos incorporan pantallas, redes sociales e IA como contexto; pueden pedir hábitos, vocabulario o consecuencias sociales.","exercises":["Diferencia RAM/almacenamiento.","Función de router.","Tres señales de phishing.","Explica copia 3-2-1.","Pasos para verificar noticia viral."],"solutions":["RAM temporal y volátil; almacenamiento persistente.","Encamina tráfico entre redes.","Urgencia, dominio raro, credenciales/adjunto inesperado.","Tres copias, dos medios, una fuera del equipo/ubicación.","Revisar fuente/fecha/autor, buscar evidencia original y contrastar medios fiables."],"checklist":["Distingo hardware/software.","Aplico seguridad práctica.","Evalúo fuentes."]},{"title":"Tecnología y sociedad: impacto y diseño sostenible","goals":["Impacto: valorar beneficios y costes","Economía circular: diseñar para durar y reparar","Accesibilidad: incluir diversidad","IA: reconocer límites, sesgos y responsabilidad"],"sections":[["Explicación desde cero",["La tecnología no es neutral en efectos: decisiones de diseño distribuyen beneficios, costes y riesgos. Evaluar incluye quién gana, quién queda fuera y qué recursos consume.","Economía lineal extrae-fabrica-tira. Circular intenta reducir materiales, alargar vida, reparar, reutilizar, remanufacturar y reciclar al final.","Diseño universal busca productos utilizables por diversidad de capacidades: contraste, texto alternativo, controles claros y alternativas a audio o color.","IA aprende patrones de datos y puede equivocarse, reproducir sesgos y generar contenido convincente falso. La responsabilidad sigue siendo humana: verificar y proteger datos."]]],"rules":["Mejor residuo: el que no se genera","Accesibilidad se diseña desde el inicio","IA: salida plausible no equivale a verdad"],"examples":[["Móvil","Valora minerales, agua, energía, duración, reparabilidad, actualizaciones y reciclaje."],["Decisión","Un dispositivo más eficiente pero irreparable puede ser peor si se sustituye pronto; compara vida completa."]],"mistakes":["Reducir sostenibilidad a reciclar.","Pensar que IA comprende o garantiza verdad.","Diseñar solo para usuario promedio."],"exam":"Se pide argumentar medidas, impactos y hábitos. Una respuesta fuerte usa criterio, mecanismo y posible límite.","exercises":["Tres principios de ecodiseño.","Diferencia reutilizar/reciclar.","Dos mejoras accesibles de una app.","Riesgo de datos sesgados.","Compara reparar portátil o comprar otro con criterios."],"solutions":["Menos material, modular/reparable, durable/reciclable.","Reutilizar mantiene objeto; reciclar transforma material y suele gastar más energía.","Contraste y tamaño; navegación teclado; subtítulos/alt text.","Modelo reproduce discriminación o errores presentes en datos.","Coste, rendimiento, vida restante, piezas, energía incorporada, garantía y residuos; reparar suele ganar si extiende vida suficiente."],"checklist":["Analizo ciclo de vida.","Incluyo accesibilidad.","Uso IA con verificación."]}],"questions":[{"id":"tecnologia-r-0-0","chapter":0,"type":"mcq","prompt":"¿Qué regla o relación corresponde al tema «Proceso tecnológico y representación»?","options":["Necesidad → investigación → ideas → diseño → planificación → construcción → prueba → mejora","Accesibilidad se diseña desde el inicio","F₁·d₁=F₂·d₂","η=salida/entrada·100"],"answer":0,"explanation":"La relación correcta es Necesidad → investigación → ideas → diseño → planificación → construcción → prueba → mejora. Las preguntas se integran con cálculos, lectura de esquemas y decisiones justificadas."},{"id":"tecnologia-m-0-0","chapter":0,"type":"mcq","prompt":"¿Es correcta esta afirmación? Elegir una solución antes de definir requisitos.","options":["No: describe un error frecuente","Sí: es la regla general","Solo si se ignoran las unidades","No se puede saber"],"answer":0,"explanation":"Es uno de los errores que debes evitar. Revisa: Necesidad → investigación → ideas → diseño → planificación → construcción → prueba → mejora"},{"id":"tecnologia-m-0-1","chapter":0,"type":"mcq","prompt":"¿Es correcta esta afirmación? Confundir dibujo decorativo con esquema funcional.","options":["No: describe un error frecuente","Sí: es la regla general","Solo si se ignoran las unidades","No se puede saber"],"answer":0,"explanation":"Es uno de los errores que debes evitar. Revisa: Necesidad → investigación → ideas → diseño → planificación → construcción → prueba → mejora"},{"id":"tecnologia-m-0-2","chapter":0,"type":"mcq","prompt":"¿Es correcta esta afirmación? Omitir seguridad y final de vida. ble."},{"id":"tecnologia-o-7-1","chapter":7,"type":"open","prompt":"Diferencia reutilizar/reciclar.","solution":"Reutilizar mantiene objeto; reciclar transforma material y suele gastar más energía.","explanation":"Reutilizar mantiene objeto; reciclar transforma material y suele gastar más energía."},{"id":"tecnologia-o-7-2","chapter":7,"type":"open","prompt":"Dos mejoras accesibles de una app.","solution":"Contraste y tamaño; navegación teclado; subtítulos/alt text.","explanation":"Contraste y tamaño; navegación teclado; subtítulos/alt text."},{"id":"tecnologia-o-7-3","chapter":7,"type":"open","prompt":"Riesgo de datos sesgados.","solution":"Modelo reproduce discriminación o errores presentes en datos.","explanation":"Modelo reproduce discriminación o errores presentes en datos."},{"id":"tecnologia-o-7-4","chapter":7,"type":"open","prompt":"Compara reparar portátil o comprar otro con criterios.","solution":"Coste, rendimiento, vida restante, piezas, energía incorporada, garantía y residuos; reparar suele ganar si extiende vida suficiente.","explanation":"Coste, rendimiento, vida restante, piezas, energía incorporada, garantía y residuos; reparar suele ganar si extiende vida suficiente."}],"pdf":"GESO_2026_tecnologia_COMPLETO.pdf"},{"key":"sociales_geografia_historia","title":"Ciencias Sociales, Geografía e Historia","subtitle":"Mapas, ciudadanía, economía e historia contemporánea con líneas del tiempo y análisis de fuentes","color":"#B91C1C","domain":"ámbito social (2 horas)","sourceNote":"La pauta 2/2026 organiza cuatro actividades de 25 puntos con textos, mapas, cronologías, gráficos, arte, ODS, economía, igualdad y ciudadanía. Memorizar sin analizar fuentes no basta.","examWeight":"Modelo 2/2026: cuatro actividades de 25 puntos.","chapters":[{"title":"Tiempo histórico, fuentes y lectura crítica","goals":["Cronología: ordenar siglos, fechas y duraciones","Fuente: distinguir primaria/secundaria","Contexto: situar autor, momento y propósito","Causalidad: separar causas, detonantes y consecuencias"],"sections":[["Explicación desde cero",["La historia estudia cambios y continuidades mediante fuentes. Una fuente primaria se produce en la época; una secundaria analiza después. Primaria no significa automáticamente verdadera: ambas requieren crítica.","Para pasar año a siglo: 1789 pertenece al XVIII; 1900 al XIX y 1901 al XX. Antes de Cristo, los años disminuyen hacia el presente y no existe año cero en la cronología tradicional.","Analizar un texto: naturaleza, autor, fecha, destinatario, tema, contexto, ideas y límites. En imagen añade símbolos, composición y función.","Los hechos tienen causas estructurales a largo plazo, coyunturales y detonantes. Evita explicar una guerra con una sola causa."]]],"rules":["Años 1701-1800 = siglo XVIII","Fuente: qué es + quién + cuándo + para quién + por qué","Causa ≠ detonante ≠ consecuencia"],"examples":[["Cartel","Un cartel de 1937 es fuente primaria sobre propaganda, no fotografía neutral de toda la sociedad."],["Cronología","1914-1918 dura aproximadamente cuatro años y pertenece al siglo XX."]],"mistakes":["Confundir fuente primaria con fiable.","Escribir siglo XVII para 1789.","Describir una imagen sin interpretarla."],"exam":"El examen usa textos, mapas, gráficos, fotografías y arte. La respuesta debe extraer evidencia y aplicar conocimientos.","exercises":["Siglo de 1492, 1789, 1936 y 2001.","Clasifica diario de soldado y manual actual.","Elementos para analizar cartel.","Diferencia causa/detonante con ejemplo.","Por qué contrastar fuentes."],"solutions":["XV, XVIII, XX y XXI.","Primaria y secundaria.","Autor, fecha, destinatario, símbolos, mensaje, contexto y propósito.","Tensiones previas son causas; atentado/acto inmediato puede detonar.","Tienen perspectivas, objetivos y límites distintos; el contraste mejora fiabilidad."],"checklist":["Domino siglos.","Analizo fuente, no la resumo solo.","Construyo explicaciones multicausales."]},{"title":"Mapas, coordenadas, escala y relieve","goals":["Orientación: usar puntos cardinales y coordenadas","Escala: calcular distancia","Mapa: leer leyenda, proyección y tipo","Relieve: reconocer grandes formas"],"sections":[["Explicación desde cero",["Latitud mide distancia angular al ecuador, norte o sur, hasta 90°. Longitud mide respecto a Greenwich, este u oeste, hasta 180°. Se escribe primero latitud.","Escala numérica 1:n convierte medidas del mapa; escala gráfica permite medir directamente y conserva utilidad al ampliar. Un mapa siempre selecciona y simplifica.","Mapas físicos muestran relieve; políticos, fronteras; temáticos, una variable. Coropletas usan intensidad de color por unidades territoriales y deben compararse con tasas, no números absolutos, si áreas difieren.","Montañas, mesetas, llanuras, valles y depresiones condicionan asentamientos y transporte. Ríos se organizan en cuencas y vertientes."]]],"rules":["Escala 1:n → real=mapa·n","Latitud N/S; longitud E/O","Leyenda antes de interpretar"],"examples":[["Escala","4 cm en 1:250.000 =1.000.000 cm=10 km."],["Coordenada","41°N, 2°E sitúa primero norte del ecuador y después este de Greenwich."]],"mistakes":["Intercambiar latitud/longitud.","Olvidar convertir cm a km.","Interpretar color sin leyenda."],"exam":"Los modelos piden localizar, clasificar mapas y relacionar distribución espacial con factores.","exercises":["Distancia de 7 cm en 1:100.000.","Rango de latitud.","Tipo de mapa de densidad.","Diferencia tiempo meteorológico/clima.","Dos efectos del relieve en población."],"solutions":["7 km.","0-90° N o S.","Temático, normalmente coroplético.","Estado momentáneo frente a patrones de décadas.","Facilita/dificulta transporte, condiciona agricultura, riesgos y concentración en llanuras/costas."],"checklist":["Leo leyenda y escala.","Uso coordenadas.","Relaciono espacio y sociedad."]},{"title":"Clima, paisajes y medio ambiente","goals":["Clima: interpretar climogramas","Factores: latitud, altitud, mar y relieve","Paisaje: relacionar clima, vegetación y actividad","Sostenibilidad: analizar problemas y medidas"],"sections":[["Explicación desde cero",["Climograma combina temperatura media mensual y precipitación. Calcula temperatura media anual, amplitud y precipitación total; identifica meses secos según criterio indicado.","Latitud cambia radiación; altitud reduce temperatura; mar suaviza amplitud y aporta humedad; relieve produce barlovento húmedo y sotavento seco.","Mediterráneo presenta verano seco; oceánico lluvias regulares y amplitud baja; continental mayor amplitud; montaña frío y precipitación; subtropical canario suavidad y aridez variable.","Problemas ambientales requieren causas y escalas: urbanización, contaminación, desertificación, incendios, pérdida de biodiversidad y cambio climático."]]],"rules":["Amplitud=Tmes más cálido−Tmes más frío","Clima se define con series largas","ODS integran dimensión social, económica y ambiental"],"examples":[["Climograma","Si verano tiene alta T y precipitación mínima, y otoño lluvioso, es indicio mediterráneo."],["Medida","Restaurar riberas reduce erosión y riesgo de inundación y mejora hábitat; explica varios beneficios."]],"mistakes":["Identificar clima por una cifra.","Confundir aridez con ausencia total de lluvia.","Listar problemas sin relación causal."],"exam":"En 2026 el ámbito social se articuló alrededor de ODS, clima y desigualdad; se pedía leer mapas y gráficos y proponer soluciones.","exercises":["Qué datos leer en climograma.","Efecto de altitud.","Rasgo mediterráneo.","Diferencia mitigación/adaptación.","Explica desertificación como cadena causal."],"solutions":["Temperaturas, amplitud, precipitaciones, distribución y sequedad.","Desciende temperatura y cambia precipitación/vegetación.","Sequía estival.","Reducir causas frente a prepararse para impactos.","Sobreexplotación/deforestación+sequía→menos cubierta→erosión y pérdida de suelo→menor productividad."],"checklist":["Interpreto climogramas.","Uso factores climáticos.","Argumento sostenibilidad."]},{"title":"Población, demografía y migraciones","goals":["Indicadores: calcular natalidad, mortalidad y densidad","Estructura: leer pirámides","Transición: explicar cambios demográficos","Migración: diferenciar factores y efectos"],"sections":[["Explicación desde cero",["Densidad divide población entre superficie. Tasas de natalidad y mortalidad suelen expresarse por mil. Crecimiento natural es nacimientos menos defunciones; crecimiento real añade saldo migratorio.","Pirámide expansiva tiene base ancha y población joven; estacionaria, equilibrio; regresiva, base estrecha y envejecimiento. Irregularidades reflejan guerras, baby boom o migración.","Transición demográfica pasa de natalidad/mortalidad altas a bajas: primero cae mortalidad, crece población; después cae natalidad.","Migración tiene factores de expulsión y atracción, voluntarios o forzados. Efectos son diversos: trabajo, remesas, diversidad, presión de servicios, despoblación o envejecimiento. Evita generalizaciones."]]],"rules":["Densidad=habitantes/km²","Saldo migratorio=inmigrantes−emigrantes","Crecimiento real=natural+saldo"],"examples":[["Tasa","500 nacimientos en 50.000 habitantes: 500/50.000·1.000=10‰."],["Pirámide","Base estrecha y cima relativamente ancha indica baja natalidad y envejecimiento."]],"mistakes":["Usar porcentaje cuando piden por mil.","Confundir emigrante/inmigrante según lugar.","Atribuir una sola causa a migraciones."],"exam":"Frecuente: gráficos, mapas de distribución, desigualdad, migraciones y explicaciones con datos.","exercises":["Densidad de 2 millones en 10.000 km².","Saldo 8.000 inmigrantes y 3.000 emigrantes.","Pirámide de país envejecido.","Dos push y dos pull.","Dos efectos en origen y destino."],"solutions":["200 hab/km².","+5.000.","Regresiva: base estrecha y mayor peso adulto/anciano.","Conflicto/desempleo; seguridad/empleo.","Origen: remesas y pérdida de jóvenes; destino: mano de obra/diversidad y necesidad de servicios/integración."],"checklist":["Calculo tasas.","Leo pirámides.","Explico migración sin estereotipos."]},{"title":"Economía, sectores y globalización","goals":["Sectores: clasificar actividades","Agentes: comprender hogares, empresas y Estado","Indicadores: interpretar PIB, renta y desigualdad","Globalización: analizar cadenas y dependencia"],"sections":[["Explicación desde cero",["Primario obtiene recursos; secundario transforma; terciario presta servicios; cuaternario gestiona conocimiento. Una cadena productiva combina varios.","Hogares consumen y ofrecen trabajo; empresas producen e invierten; Estado regula, recauda y presta servicios; sector financiero canaliza ahorro/crédito.","PIB mide producción monetaria, no bienestar total ni reparto. PIB per cápita es promedio. Desigualdad, salud, educación y ambiente completan análisis.","Globalización intensifica flujos de bienes, capital, personas, datos y cultura. Puede abaratar y difundir tecnología, pero también crear dependencia, presión laboral y ambiental."]]],"rules":["Productividad=producción/recursos","PIB per cápita=PIB/población","Valor añadido=valor producción−consumos intermedios"],"examples":[["Cadena","Algodón primario; tejido y confección secundario; transporte y venta terciario; diseño/software cuaternario."],["Mapa de riqueza","Debe mirarse indicador per cápita y fuente; color oscuro no demuestra causalidad."]],"mistakes":["Confundir sector público con terciario: son clasificaciones distintas.","Usar PIB como sinónimo de felicidad.","Decir globalización solo comercio."],"exam":"El examen social mezcla modos de producción, sectores, ODS, mapas de riqueza y argumentación.","exercises":["Clasifica agricultor, fábrica, hospital y laboratorio I+D.","Limitación del PIB.","Qué es cadena global de valor.","Beneficio y riesgo de deslocalización.","Tres funciones económicas del Estado."],"solutions":["Primario, secundario, terciario, cuaternario.","No refleja reparto, trabajo no remunerado ni daño ambiental.","Fases repartidas entre países/empresas.","Menor coste/empleo en destino; dependencia, derechos o pérdida industrial en origen.","Regular, redistribuir, servicios/infraestructura y estabilizar."],"checklist":["Clasifico con criterio.","Interpreto indicadores críticamente.","Analizo ventajas y costes."]},{"title":"Democracia, Constitución e instituciones","goals":["Estado democrático: conocer principios","Separación de poderes: asignar funciones","Constitución: entender derechos y deberes","Territorio: diferenciar Estado, comunidad, provincia y municipio"],"sections":[["Explicación desde cero",["Democracia exige elecciones libres, pluralismo, derechos, legalidad y control del poder; no es solo votar. Ciudadanía participa también mediante asociaciones, debate y control.","Legislativo aprueba leyes y controla Gobierno; ejecutivo gobierna y administra; judicial juzga con independencia. La separación tiene contrapesos.","La Constitución de 1978 define España como Estado social y democrático de derecho, monarquía parlamentaria y organización territorial descentralizada.","Cataluña tiene autogobierno mediante Generalitat: Parlament, Presidència/Govern y otras instituciones según Estatut, dentro del marco constitucional y europeo."]]],"rules":["Legislativo: leyes/control","Ejecutivo: gobierno/administración","Judicial: juzgar/hacer cumplir","Derechos implican límites y deberes"],"examples":[["Institución","Ayuntamiento gestiona competencias locales; Generalitat autonómicas; Estado las estatales; UE las atribuidas por tratados."],["Derecho","Libertad de expresión protege crítica, pero no elimina responsabilidad por amenazas o delitos."]],"mistakes":["Decir que jueces hacen leyes ordinarias.","Confundir Gobierno y Parlamento.","Tratar derecho como absoluto sin límites legales."],"exam":"Puede pedir emparejar instituciones, explicar derechos, ciudadanía e igualdad. Respuestas deben ser precisas y no partidistas.","exercises":["Tres elementos de democracia.","Funciones de los tres poderes.","Forma política española.","Órgano legislativo catalán.","Diferencia derecho/deber con ejemplo."],"solutions":["Elecciones/pluralismo, derechos, legalidad/control.","Leyes; gobierno; justicia.","Monarquía parlamentaria en Estado social y democrático de derecho.","Parlament de Catalunya.","Derecho permite exigir libertad/servicio; deber obliga, como respetar derechos o contribuir según ley."],"checklist":["Asigno instituciones.","Conozco principios de 1978.","Argumento ciudadanía."]},{"title":"Revoluciones liberales, industrialización e imperialismo","goals":["Liberalismo: explicar ruptura con Antiguo Régimen","Industrialización: conectar tecnología, capital y sociedad","Movimiento obrero: reconocer respuestas","Imperialismo: analizar causas y consecuencias"],"sections":[["Explicación desde cero",["Antiguo Régimen combinaba monarquía absoluta, sociedad estamental y economía agraria. Ilustración y revoluciones americana y francesa difundieron soberanía nacional, derechos e igualdad jurídica, aunque su aplicación fue limitada.","Industrialización comenzó en Gran Bretaña con agricultura productiva, capital, carbón, mercados e innovaciones. Fábrica y máquina de vapor elevaron producción y urbanización.","La sociedad de clases sustituyó privilegio jurídico, pero mantuvo desigualdad. Obreros organizaron sindicatos, socialismo y anarquismo para derechos laborales.","Imperialismo del XIX mezcló materias primas, mercados, rivalidad, estrategia e ideologías racistas. Impuso fronteras, explotación y cambios duraderos, junto con infraestructuras orientadas al dominio."]]],"rules":["1789: Revolución francesa","c.1760-1840: primera industrialización","1884-85: Conferencia de Berlín"],"examples":[["Causa-consecuencia","Máquina no explica sola industrialización: necesita energía, capital, trabajo, materias, transporte y mercado."],["Fuente","Caricatura imperial requiere identificar quién la produjo y qué jerarquías normaliza."]],"mistakes":["Presentar Revolución francesa como instantáneamente democrática para todos.","Reducir imperialismo a 'llevar progreso'.","Confundir estamento y clase."],"exam":"Suele aparecer mediante cronología, conceptos, textos, arte y relaciones entre producción y épocas.","exercises":["Tres rasgos Antiguo Régimen.","Dos causas industrialización británica.","Dos cambios urbanos/sociales.","Objetivo sindicato.","Dos causas y dos consecuencias imperialismo."],"solutions":["Absolutismo, estamentos, economía agraria.","Carbón/capital/mercados/agricultura/inventos.","Urbanización, fábrica, burguesía/proletariado y malas condiciones.","Defender colectivamente derechos laborales.","Mercados/rivalidad; explotación/fronteras/conflictos y dependencia."],"checklist":["Construyo cronología.","Explico procesos multicausales.","Analizo legado imperial."]},{"title":"Primera Guerra Mundial, Revolución rusa y entreguerras","goals":["I Guerra: distinguir causas y detonante","Revolución rusa: ordenar 1905-febrero-octubre","Crisis de 1929: explicar difusión","Fascismos: reconocer rasgos"],"sections":[["Explicación desde cero",["Antes de 1914 existían rivalidades imperiales, nacionalismos, alianzas y carrera armamentística. El asesinato de Sarajevo detonó una crisis que las alianzas generalizaron.","La guerra de trincheras movilizó economías y sociedades; el Tratado de Versalles redibujó fronteras e impuso condiciones a Alemania. No fue causa única del nazismo, pero alimentó resentimiento.","Rusia: febrero de 1917 derribó zar; octubre llevó a bolcheviques al poder. Guerra civil y posterior URSS transformaron Estado y economía.","Crisis de 1929 provocó quiebras, desempleo y contracción internacional. Fascismo y nazismo fueron ultranacionalistas, autoritarios, antidemocráticos, movilizadores y represivos; nazismo añadió racismo biológico y antisemitismo central."]]],"rules":["1914-1918 I Guerra Mundial","1917 revoluciones rusas","1929 crack","1933 Hitler canciller"],"examples":[["Detonante","Sarajevo inicia crisis; causas profundas explican por qué se convierte en guerra continental."],["Comparación","Democracia plural acepta oposición; fascismo elimina pluralismo y subordina individuo al Estado/nación."]],"mistakes":["Llamar comunista al gobierno provisional de febrero.","Equiparar cualquier dictadura sin rasgos.","Decir que Versalles por sí solo causó nazismo."],"exam":"Pueden pedir cronología, ideologías, propaganda o consecuencias. Usa fechas ancla y conceptos.","exercises":["Cuatro causas de I Guerra.","Detonante.","Diferencia febrero/octubre 1917.","Dos efectos 1929.","Cuatro rasgos fascistas y uno específico nazi."],"solutions":["Alianzas, militarismo, imperialismo, nacionalismos.","Asesinato de Francisco Fernando y crisis de julio.","Cae zar y gobierno provisional; bolcheviques toman poder.","Desempleo/quiebras/caída comercio y radicalización.","Autoritarismo, partido/líder, ultranacionalismo, violencia; racismo antisemita biológico."],"checklist":["Ordeno 1914-1933.","Distingo causa/detonante.","Defino ideologías con rasgos."]},{"title":"Segunda Guerra Mundial, Holocausto y Guerra Fría","goals":["II Guerra: explicar expansión y alianzas","Holocausto: comprender persecución y genocidio","Posguerra: situar ONU y descolonización","Guerra Fría: analizar bloques y conflictos indirectos"],"sections":[["Explicación desde cero",["Expansionismo nazi, fascista y japonés, debilidad de seguridad colectiva y apaciguamiento precedieron invasión de Polonia en 1939. Eje y Aliados libraron guerra total en varios frentes.","El Holocausto fue persecución y asesinato sistemático de seis millones de judíos por régimen nazi y colaboradores, junto a otros grupos perseguidos. Pasó de exclusión y guetos a deportación y exterminio.","1945 dejó devastación, ONU, juicios y nuevo orden. Descolonización creó Estados independientes, a menudo con fronteras y dependencias heredadas.","Guerra Fría enfrentó bloques liderados por EEUU y URSS sin guerra directa total: armas nucleares, propaganda, alianzas, carrera espacial y guerras por delegación. Terminó con crisis y disolución soviética en 1991."]]],"rules":["1939-1945 II Guerra","1945 ONU","1947-1991 Guerra Fría","1989 muro de Berlín","1991 fin URSS"],"examples":[["Fuente memorial","Testimonio de víctima aporta experiencia imprescindible, pero se contextualiza con otros documentos para reconstrucción amplia."],["Guerra fría","Cuba 1962 muestra disuasión nuclear: riesgo extremo sin combate directo entre superpotencias."]],"mistakes":["Reducir Holocausto a consecuencia casual de guerra.","Confundir Guerra Fría con ausencia de guerras.","Olvidar Asia, África y civiles."],"exam":"Literatura, fotografías, mapas de bloques y derechos humanos conectan este bloque con lengua y ciudadanía.","exercises":["Causa inmediata II Guerra.","Define Holocausto con precisión.","Objetivo ONU.","Qué es guerra por delegación.","Ordena 1939,1945,1962,1989,1991."],"solutions":["Invasión alemana de Polonia.","Genocidio sistemático de judíos europeos por nazismo y colaboradores, con otros grupos perseguidos.","Paz/seguridad, cooperación y derechos.","Conflicto local apoyado por superpotencias sin choque directo pleno.","II Guerra; fin/ONU; crisis Cuba; muro; fin URSS."],"checklist":["Uso lenguaje histórico preciso.","Sitúo bloques y fechas.","Reconozco dimensión humana."]},{"title":"España y Cataluña contemporáneas","goals":["Crisis liberal: situar XIX y Restauración","República y Guerra Civil: ordenar 1931-1939","Franquismo: reconocer dictadura y etapas","Transición: explicar paso a democracia y autonomía"],"sections":[["Explicación desde cero",["El XIX español alternó construcción liberal, guerras, pronunciamientos y monarquías. Industrialización fue desigual, con focos como Cataluña; Restauración desde 1874 estabilizó mediante turno y caciquismo.","Segunda República (1931) impulsó reformas y vivió fuerte polarización. El golpe militar de julio de 1936 fracasó parcialmente y abrió Guerra Civil hasta 1939, con intervención exterior y represión.","Franquismo fue dictadura sin pluralismo, con represión, centralismo y nacionalcatolicismo. Pasó de autarquía a crecimiento y cambio social desde finales de 1950, sin democratización.","Tras muerte de Franco en 1975, reformas, movilización y pactos condujeron a elecciones 1977 y Constitución 1978. Generalitat fue restablecida y Estatut articuló autonomía catalana."]]],"rules":["1931 II República","1936-1939 Guerra Civil","1939-1975 franquismo","1977 elecciones","1978 Constitución","1979 Estatut"],"examples":[["Causalidad","Guerra Civil no se explica como pelea espontánea: golpe, fracaso parcial, polarización, desigualdades y contexto europeo."],["Transición","No fue regalo ni guion inevitable: intervinieron instituciones, oposición, sociedad, violencia, pactos y presión ciudadana."]],"mistakes":["Confundir República con Guerra Civil.","Decir que crecimiento económico convirtió dictadura en democracia.","Presentar Transición sin conflicto."],"exam":"Es bloque central. Puede aparecer en textos, carteles, cronogramas, instituciones, migraciones internas y cultura.","exercises":["Ordena 1931,1936,1939,1975,1977,1978.","Dos reformas republicanas.","Dos rasgos franquismo.","Qué cambió en 1959-60.","Tres hitos Transición/autonomía."],"solutions":["República, guerra, fin guerra/dictadura, muerte Franco, elecciones, Constitución.","Agraria, militar, educativa, religiosa o territorial.","Dictadura, represión, centralismo, falta pluralismo.","Fin autarquía estricta, apertura/desarrollismo y migración/urbanización.","Elecciones 1977, Constitución 1978, restablecimiento Generalitat/Estatut 1979."],"checklist":["Domino eje 1931-1979.","Diferencio regímenes.","Explico Cataluña en contexto español/europeo."]},{"title":"Unión Europea, ciudadanía global, arte y cultura","goals":["UE: conocer origen e instituciones","Competencias: distinguir UE y Estados","Ciudadanía: aplicar derechos e igualdad","Arte: leer obra en contexto"],"sections":[["Explicación desde cero",["Integración europea buscó paz y cooperación tras 1945. De comunidades económicas evolucionó a Unión Europea; mercado, políticas comunes y ciudadanía conviven con soberanía estatal.","Comisión propone y ejecuta; Parlamento elegido y Consejo de la UE colegislan; Consejo Europeo fija orientación; Tribunal de Justicia interpreta derecho de la UE; BCE gestiona euro.","Ciudadanía europea añade circulación, residencia y participación. Derechos humanos, igualdad de género, no discriminación y sostenibilidad son marcos para analizar brechas y políticas.","Arte es fuente histórica: forma, técnica, tema, patrocinio y público reflejan sociedad. Románico, gótico, Renacimiento, Barroco y vanguardias se distinguen por rasgos y contexto, sin reducirse a fechas."]]],"rules":["Parlamento + Consejo UE: legislación","Comisión: iniciativa/ejecución","ODS: 17 objetivos Agenda 2030"],"examples":[["Brecha salarial","Distingue segregación horizontal, vertical, jornada, cuidados y discriminación; no atribuyas todo a una cifra sin análisis."],["Arte","Perspectiva y humanismo orientan Renacimiento; una obra concreta se analiza por evidencia visual y contexto."]],"mistakes":["Confundir Consejo Europeo/Consejo de la UE.","Decir UE=Europa.","Identificar arte solo por gusto."],"exam":"En 2026 aparecieron ODS, modos de producción, igualdad, patriarcado, capital y arte sostenible. Las cuatro actividades valían 25 puntos.","exercises":["Dos motivos origen integración.","Funciones Comisión y Parlamento.","Qué es ODS.","Segregación horizontal/vertical.","Método de análisis de obra artística."],"solutions":["Paz y cooperación/reconstrucción/mercado.","Propone/ejecuta; representa ciudadanía y colegisla.","Objetivo universal de Agenda 2030 que integra sostenibilidad social, económica y ambiental.","Concentración por sectores; dificultad para ascender a poder.","Identificar, describir forma/técnica/tema, contextualizar autor/público y explicar significado/función."],"checklist":["Conozco instituciones UE.","Analizo desigualdad con conceptos.","Leo arte como fuente."]}],"ques er"],"answer":0,"explanation":"Es uno de los errores que debes evitar. Revisa: Parlamento + Consejo UE: legislación"},{"id":"sociales_geografia_historia-m-10-2","chapter":10,"type":"mcq","prompt":"¿Es correcta esta afirmación? Identificar arte solo por gusto.","options":["No: describe un error frecuente","Sí: es la regla general","Solo si se ignoran las unidades","No se puede saber"],"answer":0,"explanation":"Es uno de los errores que debes evitar. Revisa: Parlamento + Consejo UE: legislación"},{"id":"sociales_geografia_historia-o-10-0","chapter":10,"type":"open","prompt":"Dos motivos origen integración.","solution":"Paz y cooperación/reconstrucción/mercado.","explanation":"Paz y cooperación/reconstrucción/mercado."},{"id":"sociales_geografia_historia-o-10-1","chapter":10,"type":"open","prompt":"Funciones Comisión y Parlamento.","solution":"Propone/ejecuta; representa ciudadanía y colegisla.","explanation":"Propone/ejecuta; representa ciudadanía y colegisla."},{"id":"sociales_geografia_historia-o-10-2","chapter":10,"type":"open","prompt":"Qué es ODS.","solution":"Objetivo universal de Agenda 2030 que integra sostenibilidad social, económica y ambiental.","explanation":"Objetivo universal de Agenda 2030 que integra sostenibilidad social, económica y ambiental."},{"id":"sociales_geografia_historia-o-10-3","chapter":10,"type":"open","prompt":"Segregación horizontal/vertical.","solution":"Concentración por sectores; dificultad para ascender a poder.","explanation":"Concentración por sectores; dificultad para ascender a poder."},{"id":"sociales_geografia_historia-o-10-4","chapter":10,"type":"open","prompt":"Método de análisis de obra artística.","solution":"Identificar, describir forma/técnica/tema, contextualizar autor/público y explicar significado/función.","explanation":"Identificar, describir forma/técnica/tema, contextualizar autor/público y explicar significado/función."}],"pdf":"GESO_2026_sociales_geografia_historia_COMPLETO.pdf"},{"key":"lengua_catalana","title":"Llengua Catalana","subtitle":"Comprensió oral i escrita, correcció lingüística i redacció de 150-200 paraules","color":"#0F766E","domain":"àmbit de comunicació (català + castellà + anglès)","sourceNote":"La pauta 2/2026 incluye comprensión oral, lectura y literatura, gramática y léxico aplicados, y una expresión escrita de 40 puntos. La revisión lingüística es decisiva.","examWeight":"Modelo 2/2026: actividades de 20, 10, 20 y 40 puntos.","chapters":[{"title":"Estratègies de comprensió oral","goals":["Primera escolta: captar tema i situació","Segona escolta: localitzar dades i relacions","Inferència: entendre intenció i sentit","Resposta: ser precisa i no afegir informació"],"sections":[["Explicación desde cero",["Abans de sentir l’àudio, llegeix les preguntes i subratlla què busques: persona, lloc, causa, opinió, ordre o xifra. Això dirigeix l’atenció sense intentar escriure-ho tot.","A la primera escolta identifica tema, interlocutors i estructura. A la segona completa detalls i verifica. Pren notes amb paraules clau, fletxes i abreviatures.","Diferencia informació explícita d’inferència. Si demanen dos motius, dona exactament dos. En cert/fals, revisa negacions, quantificadors i matisos.","La resposta ha de ser lingüísticament clara. No copiïs fragments inconnexos ni converteixis una dada probable en afirmació segura."]]],"rules":["Pregunta → paraules clau → 1a escolta global → 2a escolta selectiva → revisió"],"examples":[["Dos motius","Notes: '12 notes/pals' i 'nascuda 12 des'. Resposta: El títol fa referència a les dotze notes o pals i a la data de naixement de la compositora."],["Inferència","Si diu que el disc es va construir entre tot el quartet, la idea és elaboració col·lectiva, encara que no pronunciï exactament aquesta paraula."]],"mistakes":["Escriure durant tota la primera escolta i perdre el fil.","Respondre tres elements quan en demanen dos.","Confondre el que diu l’entrevistador amb l’entrevistat."],"exam":"El model 2026 dedica 20 punts a l’activitat oral: preguntes obertes, cert/fals, sigles i correcció de formes dins un text.","exercises":["Prepara una plantilla de notes per qui/què/on/quan/per què.","Transforma la nota 'ESMUC—2 músics' en frase completa.","Què fas si no entens una paraula?","Com verifiques un cert/fals?","Resumeix en una frase una entrevista sobre crear un disc."],"solutions":["Una graella amb les cinc preguntes i espai per dades.","Va conèixer dos dels músics del grup a l’ESMUC.","Mantinc el fil i infereixo pel context; no em bloquejo.","Busco la idea exacta i vigilo negacions/absoluts.","Exemple: La compositora explica com el treball col·lectiu i les seves influències van donar forma al disc."],"checklist":["Llegeixo preguntes abans.","Dono el nombre exacte d’elements.","Separo dada i inferència."]},{"title":"Comprensió lectora i tipologies textuals","goals":["Tema: formular-lo amb precisió","Estructura: dividir en parts","Inferència: deduir amb proves","Tipologia: reconèixer narració, descripció, exposició, argumentació i instrucció"],"sections":[["Explicación desde cero",["El tema és la idea central en una frase nominal o breu; no és un títol inventat ni el resum complet. Les idees principals sostienen el tema; els exemples són secundaris.","En narració identifica narrador, personatges, temps, espai i seqüència. En text expositiu, definicions i explicacions. En argumentatiu, tesi, arguments, contraarguments i conclusió.","Una inferència ha de recolzar-se en indicis del text. Quan preguntin significat figurat, substitueix l’expressió per una idea que funcioni en el context.","Per ordenar informació, mira connectors, pronoms, repeticions lèxiques i progressió. Una resposta de comprensió no necessita copiar un paràgraf sencer."]]],"rules":["Tema = de què tracta + enfocament","Tesi = posició que es defensa","Inferència = conclusió + prova textual"],"examples":[["Narrador","Si el relat usa 'jo' i participa, és narrador intern protagonista o testimoni segons el paper."],["Argumentació","Tesi: cal limitar pantalles a la nit. Argument: alteren descans. Evidència: dades d’un estudi."]],"mistakes":["Confondre autor real i narrador.","Respondre sobre el tema amb una paraula massa general.","Inventar informació externa."],"exam":"Els textos oficials inclouen fragments literaris i articles periodístics amb preguntes de comprensió, gènere i llengua.","exercises":["Defineix tema d’un text sobre beneficis de caminar.","Diferencia tesi/argument.","Narrador en 'Vaig entrar i vaig veure'.","Què és sentit figurat?","Cita una prova per a una inferència inventada sobre un personatge nerviós."],"solutions":["Els beneficis per a la salut de l’activitat física lleugera.","Posició central i raó que la sosté.","Primera persona, narrador intern.","Significat no literal interpretat pel context.","'Tamborinava amb els dits i mirava el rellotge cada minut' permet inferir nerviosisme/impaciència."],"checklist":["Formulo tema específic.","Identifico narrador i tipologia.","Justifico inferències."]},{"title":"Accentuació, dièresi i ortografia bàsica","goals":["Síl·laba tònica: classificar aguda, plana i esdrúixola","Accents: aplicar oberts i tancats","Dièresi: reconèixer funcions","Conflictes: resoldre a/e, o/u, b/v, g/j, x/ix, s/ss/c/ç"],"sections":[["Explicación desde cero",["Les agudes s’accentuen si acaben en vocal, vocal+s, -en o -in; les planes, quan no hi acaben; les esdrúixoles, sempre. Cal separar síl·labes i detectar tònica.","En català hi ha accent obert (`) i tancat (´). a només porta obert; i/u, tancat; e/o depenen del so. Els diacrítics actuals són limitats: bé/be, déu/deu, és/es, mà/ma, més/mes, món/mon, pèl/pel, què/que, sé/se, sí/si, sòl/sol, són/son, té/te, ús/us, vós/vos.","La dièresi indica que u sona en qüe/güe o que dues vocals no formen diftong: qüestió, pingüí, raïm. Hi ha excepcions per sufixos i formes verbals.","L’ortografia s’aprèn per famílies i contrastos. Revisa vocals neutres, o/u àtones, consonants i apostrofació amb lectura final lenta."]]],"rules":["Aguda: accent si vocal/vocal+s/en/in","Plana: accent si NO acaba així","Esdrúixola: sempre","Dièresi: u pronunciada o hiat"],"examples":[["Accent","música és esdrúixola; també sempre porta accent."],["Dièresi","veïna separa ve-ï-na; sense dièresi es llegiria com diftong segons la regla."]],"mistakes":["Accentuar per semblança castellana.","Posar diacrítics antics indiscriminadament.","No revisar accents en una redacció perquè 's’entén'."],"exam":"La redacció pot perdre 1 punt per falta; més de 20 errors o errors que dificulten comprensió poden deixar la correcció a zero.","exercises":["Accentua: musica, camio, facil, historia, despres.","Explica més/mes.","Posa dièresi si cal: raim, questio, pinguí.","Plural de braç i nas.","Corregeix: La meva cosina es molt simpatica."],"solutions":["música, camió, fàcil, història, després.","més=quantitat; mes=període/possessiu literari.","raïm, qüestió, pingüí.","braços, nassos.","La meva cosina és molt simpàtica."],"checklist":["Classifico abans d’accentuar.","Sé els diacrítics vigents.","Faig una passada només d’ortografia."]},{"title":"Apostrofació, contraccions i pronoms febles","goals":["Article: apostrofar segons so i excepcions","Preposició: fer contraccions","Pronom feble: identificar antecedent","Combinació: col·locar pronoms amb el verb"],"sections":[["Explicación desde cero",["el/la s’apostrofen davant vocal o h muda: l’amic, l’hora. No s’apostrofa la davant i/u àtones: la història, la universitat; ni davant noms de lletra o alguns casos de confusió.","Contraccions: a+el=al, de+el=del, per+el=pel, però davant paraula apostrofada: a l’, de l’, per l’.","Pronoms febles substitueixen complements i eviten repetició: el/la/els/les per CD determinat; en per indeterminat o de; hi per lloc o complement amb a/en; li/els per CI.","Davant verb solen anar separats: el veig. Darrere infinitiu, gerundi i imperatiu afirmatiu s’uneixen amb guionet/apòstrof: veure’l, mirant-la, dona-me’l."]]],"rules":["CD determinat: el/la/els/les","Quantitat o de: en","Lloc o a/en: hi","CI: li/els"],"examples":[["Antecedent","'Vaig comprar tres pomes i me’n vaig menjar dues': en substitueix 'pomes' amb quantitat."],["Contracció","Vaig al mercat, però vaig a l’hospital."]],"mistakes":["Apostrofar la universitat.","Usar li per un CD: 'li veig' en estàndard.","No identificar a què refereix el pronom."],"exam":"El model 2026 demana antecedents de pronoms febles dins un text i formes correctes en context.","exercises":["Apostrofa: el home, la amiga, la universitat.","Contrau: de el parc; a el cinema; per el carrer.","Substitueix 'les claus' a 'He trobat les claus'.","Substitueix 'de música' a 'Parlem de música'.","Explica 'Hi vaig demà'."],"solutions":["l’home, l’amiga, la universitat.","del parc, al cinema, pel carrer.","Les he trobades.","En parlem.","hi substitueix un lloc o complement introduït per a/en, conegut pel context."],"checklist":["Apostofo amb excepcions.","Faig contraccions.","Trobo antecedents pronominals."]},{"title":"Morfologia: categories i formació de paraules","goals":["Categoria: identificar nom, adjectiu, determinant, pronom, verb, adverbi, preposició i conjunció","Concordança: controlar gènere i nombre","Derivació: separar arrel i afixos","Lèxic: usar sinònims, antònims i camps semàntics"],"sections":[["Explicación desde cero",["La categoria depèn del funcionament. El nom designa; adjectiu qualifica; determinant acompanya; pronom substitueix; verb expressa acció/estat; adverbi modifica; preposició relaciona; conjunció enllaça.","Determinants i adjectius concorden amb el nom. Vigila plurals, femenins i participis quan la norma ho exigeix.","Derivació afegeix prefixos o sufixos a una arrel: possible→impossible; música→musical. Composició uneix lexemes. Una família comparteix arrel i sentit.","Camp semàntic reuneix paraules d’un àmbit; camp lèxic pot incloure categories diferents. El significat depèn del context i del registre."]]],"rules":["Arrel + afixos = mot derivat","Concordança: nom-determinant-adjectiu","Categoria es prova dins l’oració"],"examples":[["Categoria","'Molt ràpid': molt és adverbi que modifica l’adjectiu ràpid."],["Derivació","pianista: arrel pian- i sufix -ista; designa persona vinculada a activitat."]],"mistakes":["Classificar només per significat sense mirar funció.","Confondre determinant i pronom.","Inventar arrels tallant lletres."],"exam":"Els models inclouen arrels, derivació, gentilicis, sigles i classificació lèxica.","exercises":["Categories de 'Aquella noia canta molt bé'.","Arrel de desconnexió.","Deriva un adjectiu de cultura.","Gentilici de Canadà, França i el Marroc.","Diferencia sigla/abreviatura."],"solutions":["determinant, nom, verb, adverbi, adverbi.","connect-/connex- segons anàlisi; prefix des- i sufix -ió.","cultural.","canadenc/a, francès/francesa, marroquí.","Sigla usa inicials (ONU); abreviatura redueix una paraula i porta punt sovint (pàg.)."],"checklist":["Identifico funció.","Analitzo derivació.","Domino lèxic habitual."]},{"title":"Verbs i concordança","goals":["Temps: situar present, passat i futur","Aspecte: distingir acció acabada o en curs","Formes no personals: infinitiu, gerundi i participi","Concordança: mantenir persona i nombre"],"sections":[["Explicación desde cero",["El verb concorda amb subjecte. El temps situa; el mode expressa actitud: indicatiu presenta, subjuntiu possibilitat/desig/dependència i imperatiu ordre.","Passat perifràstic: vaig cantar; perfet: he cantat; imperfet: cantava; plusquamperfet: havia cantat. Tria segons relació temporal i tipus d’acció.","Infinitiu acaba sovint -ar/-er/-re/-ir; gerundi -ant/-ent/-int; participi -at/-ut/-it amb irregulars. El gerundi no ha d’expressar una acció posterior com a conseqüència.","Revisa verbs irregulars i perífrasis. En oracions condicionals, combina temps coherents: si tingués temps, hi aniria."]]],"rules":["vaig + infinitiu = passat perifràstic","haver + participi = temps compost","si + imperfet subjuntiu → condicional"],"examples":[["Formes","fer: infinitiu fer, gerundi fent, participi fet."],["Coherència","Ahir vaig arribar tard perquè havia perdut el tren: el plusquamperfet és anterior a l’arribada."]],"mistakes":["Escriure 'vaig cantaré'.","Usar infinitiu per imperatiu: 'Callar!' en registre formal.","Canviar de temps sense motiu en redacció."],"exam":"L’examen demana completar paradigmes, trobar verbs en text i triar forma segons persona, temps i context.","exercises":["Formes no personals de escriure.","Passat perifràstic de 'nosaltres venir'.","Completa: Si ho sabés, t’ho __ (dir).","Corregeix: La gent van sortir.","Explica diferència cantava/he cantat."],"solutions":["escriure, escrivint, escrit.","vam venir.","diria.","La gent va sortir.","Imperfet presenta acció habitual/en curs en passat; perfet, acció acabada vinculada al present."],"checklist":["Conjugo irregulars freqüents.","Mantinc temps coherent.","Identifico formes no personals."]},{"title":"Sintaxi, connectors i puntuació","goals":["Oració: identificar subjecte i predicat","Complements: reconèixer funcions bàsiques","Connectors: ordenar i argumentar","Puntuació: construir frases clares"],"sections":[["Explicación desde cero",["El subjecte concorda amb el verb, pot estar omès i no sempre va primer. El predicat conté el verb. El CD rep l’acció sense preposició personal en català; el CI sol anar amb a/per a.","Complements circumstancials aporten temps, lloc, manera, causa. Atribut apareix amb ser, estar o semblar; complement de règim exigeix preposició.","Connectors d’ordre: primer, després, finalment; causa: perquè, ja que; conseqüència: per tant; contrast: però, tanmateix; addició: a més. No repeteixis 'i' i 'perquè'.","La coma separa incisos, enumeracions i connectors; no separa subjecte i verb. Punt tanca idea. Dos punts introdueixen explicació o enumeració."]]],"rules":["Subjecte ↔ concordança verbal","Causa: perquè/ja que","Conseqüència: per tant/així doncs","Contrast: però/tanmateix"],"examples":[["Puntuació","Tanmateix, la mesura té un cost elevat. La coma separa el connector inicial."],["Anàlisi","'La Júlia va donar el llibre al seu germà ahir': subjecte La Júlia; CD el llibre; CI al seu germà; CCT ahir."]],"mistakes":["Coma entre subjecte i verb.","Usar doncs com a causa quan toca perquè.","Frases de sis línies sense punt."],"exam":"La redacció reserva 10 punts a estructura/presentació: paràgrafs, puntuació i connectors.","exercises":["Analitza: Els alumnes preparen l’examen a casa.","Connector de contrast.","Puntua: En primer lloc cal reduir el consum per tant convé reparar.","Uneix causa/conseqüència.","Corregeix coma: La meva amiga, treballa de tarda."],"solutions":["Subjecte Els alumnes; verb preparen; CD l’examen; CCL a casa.","però/tanmateix/en canvi.","En primer lloc, cal reduir el consum; per tant, convé reparar.","Plou; per tant, agafaré paraigua / Agafo paraigua perquè plou.","La meva amiga treballa de tarda."],"checklist":["Trobo concordança.","Varie connectors.","Puntuo en una passada específica."]},{"title":"Expressió escrita: descripció, narració i exposició","goals":["Planificació: decidir destinatari, propòsit i esquema","Paràgraf: desenvolupar una idea","Registre: mantenir adequació","Revisió: separar contingut, cohesió i correcció"],"sections":[["Explicación desde cero",["Abans d’escriure, tria opció, subratlla instruccions i fes esquema de 3-4 minuts. Reserva 7-10 minuts per revisar. L’extensió oficial és 150-200 paraules; menys de 100 pot deixar a zero la correcció lingüística.","Descripció ordena per espai o trets; narració crea situació, conflicte i desenllaç; exposició explica amb definicions, ordenació i exemples.","Cada paràgraf té una idea central i un desenvolupament. Usa referències, sinònims i connectors per evitar repeticions. Posa títol només si el format ho permet.","Revisa en capas: 1 contenido/tarea, 2 párrafos/connectors, 3 verbs/concordancia, 4 accents/apòstrofs/puntuació, 5 nombre de paraules."]]],"rules":["150-200 paraules","Introducció → desenvolupament → tancament","Revisió en 5 capes"],"examples":[["Model descriptiu","Introducció situa un lloc natural; desenvolupament usa ordre visual i sensacions concretes; tancament explica què fa sentir sense repetir."],["Model expositiu","Tema pantalles: defineix ús, explica beneficis/riscs amb exemples i conclou amb pautes equilibrades."]],"mistakes":["Començar sense esquema.","Barrejar registre col·loquial amb formal.","Inflar amb frases buides.","No comptar aproximadament paraules."],"exam":"La redacció val 40/100: 10 adequació/idees, 10 estructura, 20 correcció. És el bloc amb més rendiment d’estudi.","exercises":["Esquema de descripció d’un lloc.","Escriu una introducció de 35 paraules sobre música.","Tres connectors d’ordre.","Transforma 'era bonic' en detall concret.","Crea checklist de revisió."],"solutions":["Situació→detalls sensorials ordenats→emoció/tancament.","Resposta oberta: ha de presentar tema, enfocament i to.","en primer lloc, tot seguit, finalment.","La llum taronja es reflectia a l’aigua quieta i tenyia les roques.","Tasca, estructura, connectors, verbs, accents/apòstrofs, puntuació, extensió."],"checklist":["Planifico en 4 minuts.","Escric 150-200.","Reviso per capes."]},{"title":"Text argumentatiu i entrenament d’examen","goals":["Tesi: formular posició matisada","Arguments: usar raó, exemple i evidència","Contraargument: respondre objecció","Rúbrica: autoavaluar com el corrector"],"sections":[["Explicación desde cero",["Una tesi clara respon exactament a l’afirmació. Pot ser matisada: no cal 'sí/no' absolut. Evita anunciar 'parlaré de'.","Un argument complet té afirmació, explicació i exemple/evidència. Dos arguments ben desenvolupats valen més que cinc enumerats.","Contraargument mostra que entens l’altra posició: 'És cert que..., però...'. No caricaturitzis. La conclusió sintetitza i pot proposar.","Entrena amb 45-50 minuts: 5 pla, 30 redacció, 10 revisió. Usa la rúbrica oficial: adequació 10, estructura 10, correcció 20."]]],"rules":["
