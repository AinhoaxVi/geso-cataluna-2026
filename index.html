chapter":8,"type":"open","prompt":"Autoavalua un text sobre 40.","solution":"10 adequació, 10 estructura, 20 correcció; resta aproximada per faltes segons pauta.","explanation":"10 adequació, 10 estructura, 20 correcció; resta aproximada per faltes segons pauta."}],"pdf":"GESO_2026_lengua_catalana_COMPLETO.pdf"},{"key":"lengua_castellana","title":"Lengua Castellana","subtitle":"Comprensión, ortografía, gramática y redacción de 150-200 palabras con la rúbrica oficial","color":"#BE123C","domain":"ámbito de comunicación (catalán + castellano + inglés)","sourceNote":"La pauta 2/2026 combina audio, comprensión de textos, reflexión lingüística y redacción. Se exige contestar exactamente lo pedido y escribir con cohesión y corrección.","examWeight":"Modelo 2/2026: cuatro bloques que integran comprensión oral, lectura, lengua y escritura.","chapters":[{"title":"Comprensión oral y toma de notas","goals":["Escucha global: identificar tema y voces","Escucha selectiva: recuperar datos","Inferencia: interpretar sin inventar","Respuesta: contestar con precisión"],"sections":[["Explicación desde cero",["Lee las preguntas antes del audio y clasifícalas: dato literal, causa, opinión, orden o interpretación. Anota palabras clave, no frases completas.","Primera escucha: tema, relación y estructura. Segunda: nombres, cifras, ejemplos y matices. Si una pregunta pide dos cualidades, localiza dos y no añadas una dudosa.","Distingue voz del entrevistador y entrevistado, presente y pasado, hechos y opiniones. Las preguntas de interpretación exigen reformular el sentido.","Responde con oración breve y suficiente. Una copia larga puede incluir contradicciones y no demuestra comprensión."]]],"rules":["Prelectura → escucha global → escucha selectiva → respuesta → revisión"],"examples":[["Respuesta precisa","Pregunta: ¿qué dos cualidades? Respuesta: Mantener rutinas y ser disciplinado."],["Interpretación","'Se demonizó el sector y ahora se visibiliza lo que aporta' significa que su prestigio social ha cambiado."]],"mistakes":["Intentar transcribir todo.","Responder con conocimientos propios.","No respetar número de elementos."],"exam":"El modelo 2026 dedicó 15 puntos a una entrevista con preguntas literales e interpretación.","exercises":["Diseña abreviaturas para porque, profesional, videojuego, ejemplo.","Resume una entrevista en una frase.","Diferencia dato/opinión.","Cómo responder 'por qué'.","Qué revisar en verdadero/falso."],"solutions":["pq, prof., VVJJ, ej.","Respuesta abierta con tema y enfoque.","Dato verificable frente a valoración.","Con causa explícita, no repitiendo pregunta.","Negaciones, absolutos y sujeto exacto."],"checklist":["Leo antes de escuchar.","Anoto palabras clave.","Reformulo con exactitud."]},{"title":"Comprensión lectora, textos y literatura","goals":["Lectura: localizar y relacionar información","Estructura: reconocer organización","Tipología: clasificar narrativo, descriptivo, expositivo, argumentativo e instructivo","Literatura: identificar narrador y recursos"],"sections":[["Explicación desde cero",["Haz una primera lectura sin detenerte y una segunda con preguntas. Subraya tesis, cambios de tema, conectores y referencias pronominales.","En texto periodístico distingue titular, entradilla, datos, fuentes y opinión. En divulgación busca problema, evidencia y conclusión. En narración identifica narrador, focalización, tiempo y espacio.","Tema no es resumen. Se formula como asunto más enfoque: 'beneficios de actividad ligera para la salud'.","Recursos: metáfora identifica por semejanza; comparación usa como; personificación atribuye rasgos humanos; hipérbole exagera. Explica el efecto en contexto."]]],"rules":["Tema = asunto + enfoque","Inferencia = conclusión apoyada en indicios","Autor ≠ narrador"],"examples":[["Texto divulgativo","Tesis: la actividad ligera también reduce riesgos. Evidencia: estudios con muestras y porcentajes."],["Narrador","'Yo arbitraba los partidos' es narrador interno; hay que decidir protagonista o testigo por su papel."]],"mistakes":["Copiar sin seleccionar.","Confundir tema y título.","Nombrar figura literaria sin explicar."],"exam":"En 2026 hubo artículo de salud y fragmento de novela, con comprensión, estructura, sentido figurado y cultura literaria.","exercises":["Formula tema de un texto sobre actividad física.","Diferencia hecho/opinión.","Narrador de primera persona.","Define metáfora.","Qué evidencia mejora una inferencia."],"solutions":["Beneficios de actividad ligera en todas las edades.","Verificable frente a juicio.","Interno; protagonista/testigo según papel.","Identificación implícita entre realidades por semejanza.","Cita o dato concreto del texto."],"checklist":["Identifico tesis y evidencia.","Clasifico tipología.","Analizo recursos con efecto."]},{"title":"Acentuación y ortografía","goals":["Tilde: aplicar reglas generales","Hiato/diptongo: separar correctamente","Diacrítica: distinguir pares","Ortografía: revisar b/v, g/j, h, ll/y, x/s y mayúsculas"],"sections":[["Explicación desde cero",["Agudas llevan tilde si terminan en vocal, n o s; llanas si no terminan así; esdrújulas y sobresdrújulas siempre. Primero separa sílabas y localiza tónica.","Diptongo combina vocal abierta+cerrada átona o dos cerradas; hiato separa dos abiertas o cerrada tónica con abierta: país, María. La tilde puede romper diptongo.","Diacríticas: tú/tu, él/el, mí/mi, sí/si, té/te, dé/de, sé/se, más/mas, aún/aun según valor. Solo, este y guion se escriben generalmente sin tilde según norma actual.","La ortografía se revisa por familias y reglas: haber/hecho con h; iba con b; coger pero cojo; -aje con j; palabras acabadas -ción relacionadas con -to/-do."]]],"rules":["Aguda: vocal/n/s","Llana: no vocal/n/s","Esdrújula: siempre","Interrogativos: qué, cuál, quién, cómo, cuándo, cuánto, dónde"],"examples":[["Hiato","país: pa-ís, cerrada tónica rompe diptongo."],["Diacrítica","Aun cansada, vino (=incluso). Aún no ha llegado (=todavía)."]],"mistakes":["Acentuar fue, dio, vio.","Poner tilde a solo por sistema.","No tildar interrogativos indirectos: no sé qué quiere."],"exam":"En la redacción, cada falta puede restar un punto del bloque de 20; con más de 20 o incomprensión, ese bloque puede quedar en cero.","exercises":["Acentúa: arbol, cancion, pajaro, lapiz.","Separa país, aire, río.","Completa tu/tú.","Corrige: No se que dia vendra.","Escribe por qué/porque/porqué/por que en cuatro usos."],"solutions":["árbol, canción, pájaro, lápiz.","pa-ís; ai-re; rí-o.","Tu coche / Tú conduces.","No sé qué día vendrá.","¿Por qué?; porque responde; el porqué sustantivo; motivo por que luchó (menos frecuente)."],"checklist":["Aplico regla tras silabear.","Domino diacríticas.","Hago revisión ortográfica final."]},{"title":"Categorías gramaticales y formación de palabras","goals":["Categoría: identificar por función","Determinantes/pronombres: distinguir","Derivación: usar prefijos y sufijos","Léxico: analizar familias y campos"],"sections":[["Explicación desde cero",["Sustantivo designa; adjetivo califica; determinante actualiza; pronombre sustituye; verbo predica; adverbio modifica; preposición relaciona; conjunción enlaza; interjección expresa.","La misma forma puede variar: 'muchos libros' es determinante; 'muchos llegaron' es pronombre; 'trabaja mucho' es adverbio.","Lexema aporta base; morfemas flexivos género/número/persona; derivativos crean palabras. Prefijos preceden y sufijos siguen: imposible, deportista.","Sinónimo depende del contexto. Palabras polisémicas tienen sentidos relacionados; homónimas coinciden formalmente con origen/sentido distinto."]]],"rules":["Categoría se decide en contexto","Lexema + morfemas","Derivación cambia significado o categoría"],"examples":[["Sufijo","sedentario→sedentarismo: -ismo crea sustantivo de condición/doctrina."],["Categoría","'Ese corre mucho': ese pronombre; mucho adverbio."]],"mistakes":["Clasificar por lista memorizada sin frase.","Confundir prefijo con preposición.","Crear palabra imposible sin atender cambios de lexema."],"exam":"El modelo 2026 pidió formar palabras con sufijos, familias y clasificar vocabulario deportivo.","exercises":["Categorías en 'Aquellos jóvenes compiten hoy'.","Lexema y morfemas de jugadoras.","Forma sustantivo con -ción desde organizar.","Sinónimo contextual de 'ligero' en ejercicio físico.","Campo semántico de deporte."],"solutions":["determinante, sustantivo, verbo, adverbio.","jug- + -ador- + -a + -s.","organización.","suave/de baja intensidad, no 'poco pesado' necesariamente.","árbitro, portería, entrenador, equipo, etc."],"checklist":["Pruebo categoría en contexto.","Analizo morfemas.","Elijo vocabulario preciso."]},{"title":"Verbos y concordancia","goals":["Conjugación: dominar tiempos frecuentes","Modo: elegir indicativo, subjuntivo e imperativo","Perífrasis: reconocer valor","Concordancia: evitar errores de sujeto"],"sections":[["Explicación desde cero",["Indicativo presenta hechos; subjuntivo aparece con deseo, duda, valoración o subordinación; imperativo ordena. El contexto manda más que el nombre del tiempo.","Tiempos simples/compuestos sitúan relaciones: llegó; ha llegado; había llegado. Mantén eje temporal en narración.","Perífrasis: tener que+inf obligación, ir a+inf futuro próximo, estar+gerundio desarrollo, acabar de+inf pasado inmediato. No todo verbo+infinitivo es perífrasis.","Sujeto colectivo singular suele llevar singular: la gente piensa. Haber impersonal permanece singular: hubo problemas, no hubieron."]]],"rules":["Si + imperfecto subjuntivo → condicional","Haber impersonal: hay/había/hubo","Deber de = probabilidad; deber = obligación"],"examples":[["Condicional","Si tuviera tiempo, estudiaría más."],["Impersonal","Hubo muchas dudas. 'Muchas dudas' no es sujeto, por eso no pluraliza haber."]],"mistakes":["Habían muchas personas.","Si tendría tiempo.","Dequeísmo: pienso de que."],"exam":"La corrección gramatical pesa 20 puntos en redacción y también aparece en ejercicios de transformar oraciones.","exercises":["Corrige: Hubieron errores.","Completa: Ojalá mañana __ (venir).","Si lo __ (saber), te lo diría.","Perífrasis en 'tengo que salir'.","Corrige: La mayoría opinaron."],"solutions":["Hubo errores.","venga.","supiera/supiese.","Obligación.","La mayoría opinó; plural puede aparecer por concordancia de sentido en algunos contextos, pero singular es opción segura aquí."],"checklist":["Domino haber impersonal.","Combino condicionales.","Mantengo eje temporal."]},{"title":"Sintaxis esencial","goals":["Sujeto/predicado: usar concordancia","Complementos: identificar CD, CI, atributo y circunstanciales","Subordinación: reconocer relación","Transformación: usar pronombres y voz"],"sections":[["Explicación desde cero",["Sujeto concuerda con verbo y puede omitirse. Para localizarlo cambia número del verbo. No confundas sujeto con primer sustantivo.","CD se sustituye por lo/la/los/las; CI por le/les; atributo por lo con ser/estar/parecer; complemento de régimen exige preposición. Los circunstanciales aportan información opcional.","Coordinadas unen iguales: copulativas, adversativas, disyuntivas. Subordinadas funcionan dentro de otra: sustantivas, adjetivas o adverbiales. En examen basta entender función y conector.","La pasiva perifrástica ser+participio destaca paciente; la activa suele ser más clara. Evita pasivas innecesarias en redacción."]]],"rules":["CD → lo/la/los/las","CI → le/les","Atributo → lo","Sujeto se comprueba con concordancia"],"examples":[["Análisis","Ana entregó el informe a Luis ayer: sujeto Ana; CD el informe; CI a Luis; CCT ayer."],["Subordinada","Me alegra que vengas: 'que vengas' funciona como sujeto de alegra."]],"mistakes":["Preguntar 'qué' como única prueba de CD.","Leísmo no normativo de cosa.","Separar sujeto y verbo con coma."],"exam":"No se exige análisis universitario, pero sí construir y corregir oraciones, reconocer relaciones y puntuar bien.","exercises":["Analiza: Mis compañeras enviaron un correo al profesor.","Sustituye el CD.","Atributo en 'El examen parece fácil'.","Clasifica 'pero'.","Convierte 'El ayuntamiento aprobó la norma' a pasiva."],"solutions":["Sujeto Mis compañeras; CD un correo; CI al profesor.","Lo enviaron al profesor.","fácil.","Conjunción coordinante adversativa.","La norma fue aprobada por el ayuntamiento."],"checklist":["Uso sustitución y concordancia.","Reconozco conectores.","Evito comas incorrectas."]},{"title":"Cohesión, conectores y puntuación","goals":["Cohesión: enlazar sin repetir","Conectores: expresar relación lógica","Puntuación: segmentar ideas","Registro: elegir vocabulario adecuado"],"sections":[["Explicación desde cero",["La cohesión usa pronombres, elipsis, sinónimos, repetición controlada y conectores. El referente debe ser claro: demasiados 'esto' o 'ello' generan ambigüedad.","Orden: primero/finalmente; adición: además; causa: porque/ya que; consecuencia: por tanto; contraste: sin embargo; ejemplo: por ejemplo; reformulación: es decir.","La coma no separa sujeto y verbo. Se usa en incisos, enumeración, vocativo y conectores. Punto y coma une oraciones próximas o separa elementos complejos. Dos puntos anuncian explicación o lista.","El registro del examen es estándar: evita abreviaturas de chat, tacos, muletillas y exceso de oralidad, salvo que el género lo pida."]]],"rules":["Una relación lógica, un conector","Frase clara antes que frase larga","Punto para cerrar cada idea completa"],"examples":[["Revisión","'La tecnología ayuda. Pero la tecnología también distrae.' → 'La tecnología ayuda; sin embargo, también puede distraer.'"],["Coma","Mi hermano, que vive lejos, vendrá mañana: inciso entre comas."]],"mistakes":["Encadenar todo con y.","Usar 'en plan' en texto formal.","Coma criminal entre sujeto y verbo."],"exam":"La rúbrica da 10 puntos a estructura/presentación y valora párrafos, puntuación y conectores.","exercises":["Añade conector causal.","Añade uno consecutivo.","Puntúa: Sin embargo no todos están de acuerdo.","Corrige: Mis amigos, llegaron tarde.","Reescribe dos repeticiones de 'videojuegos'."],"solutions":["porque/ya que/dado que.","por tanto/así que/en consecuencia.","Sin embargo, no todos están de acuerdo.","Mis amigos llegaron tarde.","Puede usar 'este ocio digital', 'la actividad' o pronombre claro según contexto."],"checklist":["Varío conectores.","Uso párrafos funcionales.","Mantengo registro estándar."]},{"title":"Expresión escrita: narrar, describir y exponer","goals":["Consigna: cumplir tema, género y extensión","Plan: crear estructura antes de redactar","Desarrollo: usar detalles y ejemplos","Revisión: aplicar rúbrica oficial"],"sections":[["Explicación desde cero",["Elige la opción que puedas desarrollar con vocabulario seguro. Marca todas las condiciones. La extensión oficial es 150-200 palabras; por debajo de 100 o fuera de tema el bloque de corrección puede valer cero.","Narración: situación, conflicto, cambio y cierre; descripción: orden espacial/sensorial; exposición: definición, explicación, ejemplo y síntesis.","Evita relleno. Cada párrafo debe aportar una función. Usa verbos precisos y sustantivos concretos.","Revisa contenido, párrafos, conectores, verbos, concordancia, tildes y puntuación. Cuenta aproximadamente líneas×palabras por línea."]]],"rules":["150-200 palabras","Plan 5 min + redacción 30 + revisión 10","Adecuación 10 + estructura 10 + corrección 20"],"examples":[["Descripción","En lugar de 'era bonito': 'La luz se filtraba entre los pinos y dejaba manchas doradas sobre el sendero húmedo'."],["Exposición","Define actividad ligera, aporta ejemplos, explica beneficio y cierra con recomendación realista."]],"mistakes":["Olvidar una parte de la consigna.","Escribir menos de 100.","Usar datos inventados como hechos.","No reservar tiempo de revisión."],"exam":"La redacción vale 40 puntos, el bloque más pesado. En 2026 se ofrecieron dos opciones y se exigieron 150-200 palabras.","exercises":["Haz esquema de narración breve.","Introducción para texto sobre ocio digital.","Tres detalles sensoriales.","Cierre sin repetir literalmente.","Checklist de 7 elementos."],"solutions":["Inicio/personaje→problema→decisión→consecuencia/cierre.","Respuesta abierta que presente tema y enfoque.","Vista, sonido y tacto/olor concretos.","Síntesis con aprendizaje o proyección.","Tema, género, extensión, párrafos, conectores, verbos/concordancia, ortografía/puntuación."],"checklist":["Cumplo consigna.","Planifico.","Reviso por capas."]},{"title":"Argumentación y modelo completo","goals":["Tesis: responder con claridad","Argumento: desarrollar razón y ejemplo","Contraargumento: matizar","Corrección: puntuar el texto con 40 puntos"],"sections":[["Explicación desde cero",["La tesis puede aparecer al inicio y se reafirma sin copiar en conclusión. Debe ser debatible y precisa.","Cada argumento: afirmación, explicación, ejemplo. Usa experiencia como ejemplo sin convertirla en prueba universal. Si citas datos, solo los proporcionados o conocimientos seguros.","Contraargumento mejora profundidad: reconoce parte válida y responde. Mantén tono respetuoso.","Modelo de 4 párrafos: introducción/tesis; argumento 1; argumento 2+contraargumento; conclusión/propuesta."]]],"rules":["Tesis + dos argumentos + objeción/respuesta + conclusión","No atacar persona; discutir idea"],"examples":[["Tesis","Los videojuegos pueden aportar habilidades, pero su beneficio depende del contenido, el tiempo y la forma de uso."],["Argumento","Permiten cooperación y resolución de problemas; por ejemplo, juegos de estrategia exigen planificar y revisar decisiones."]],"mistakes":["Confundir tema con tesis.","Enumerar sin desarrollar.","Conclusión con argumento nuevo.","Usar siempre 'yo pienso que'."],"exam":"Las opciones oficiales recientes piden posicionarse a favor o en contra y valoran claridad, estructura y corrección.","exercises":["Tesis sobre deporte ligero.","Dos argumentos.","Contraargumento.","Conclusión de 25-35 palabras.","Aplica rúbrica 10/10/20."],"solutions":["La actividad ligera merece incorporarse aunque no sustituya siempre ejercicio intenso.","Es accesible y reduce sedentarismo; facilita constancia, con ejemplos cotidianos.","No mejora todo igual; se combina con actividad moderada según situación.","Respuesta abierta: sintetiza y propone sin idea nueva.","Adecuación: consigna/claridad; estructura: párrafos/conectores; corrección: ortografía/gramática."],"checklist":["Defiendo una tesis matizada.","Desarrollo, no enumero.","Puedo autoevaluar sobre 40."]},{"title":"Léxico, registro y corrección final","goals":["Precisión: sustituir palabras comodín","Registro: adaptar al género","Interferencias: evitar calcos frecuentes","Edición: detectar diez tipos de error"],"sections":[["Explicación desde cero",["Palabras comodín como cosa, hacer, tema o bueno empobrecen. Sustituye según sentido: realizar, provocar, elaborar, cuestión, ventaja, eficaz.","Registro formal usa sintaxis completa y léxico estándar; un correo puede ser cordial; una narración admite voz personal. Adecuación no significa sonar artificial.","En contexto bilingüe vigila calcos: darse cuenta de, echar de menos, tener que, depende de, en relación con. No todo parecido entre catalán y castellano es incorrecto, pero revisa régimen.","Corrección final: tildes, h/b-v/g-j, concordancia, tiempos, preposiciones, pronombres, puntuación, mayúsculas, repeticiones y extensión."]]],"rules":["Verbo preciso + sustantivo concreto","Una pasada de revisión por tipo de error"],"examples":[["Precisión","'La medida hace cosas buenas' → 'La medida reduce el consumo y mejora la calidad del aire'."],["Calco","'Me he dado cuenta de que...' y no 'me he dado cuenta que' en norma cuidada."]],"mistakes":["Usar sinónimos raros que cambian sentido.","Corregir mientras redactas y perder fluidez.","Confiar solo en intuición oral."],"exam":"El modelo 2026 incluyó detectar diez palabras mal escritas y clasificarlas; la revisión consciente da puntos rápidos.","exercises":["Mejora 'hacer un cambio'.","Corrige: Me di cuenta que.","Corri ompt":"¿Es correcta esta afirmación? Confiar solo en intuición oral.","options":["No: describe un error frecuente","Sí: es la regla general","Solo si se ignoran las unidades","No se puede saber"],"answer":0,"explanation":"Es uno de los errores que debes evitar. Revisa: Verbo preciso + sustantivo concreto"},{"id":"lengua_castellana-o-9-0","chapter":9,"type":"open","prompt":"Mejora 'hacer un cambio'.","solution":"introducir/aplicar un cambio.","explanation":"introducir/aplicar un cambio."},{"id":"lengua_castellana-o-9-1","chapter":9,"type":"open","prompt":"Corrige: Me di cuenta que.","solution":"Me di cuenta de que.","explanation":"Me di cuenta de que."},{"id":"lengua_castellana-o-9-2","chapter":9,"type":"open","prompt":"Corrige: habían personas.","solution":"Había personas.","explanation":"Había personas."},{"id":"lengua_castellana-o-9-3","chapter":9,"type":"open","prompt":"Sustituye cosa en dos contextos.","solution":"Objeto/asunto/hecho/medida según contexto.","explanation":"Objeto/asunto/hecho/medida según contexto."},{"id":"lengua_castellana-o-9-4","chapter":9,"type":"open","prompt":"Enumera diez focos de revisión.","solution":"Tildes, letras, concordancia, verbos, preposiciones, pronombres, puntuación, mayúsculas, repeticiones, extensión.","explanation":"Tildes, letras, concordancia, verbos, preposiciones, pronombres, puntuación, mayúsculas, repeticiones, extensión."}],"pdf":"GESO_2026_lengua_castellana_COMPLETO.pdf"},{"key":"ingles","title":"Inglés","subtitle":"Nivel básico A2: listening, reading, grammar, vocabulary y writing de unas 75 palabras","color":"#4F46E5","domain":"ámbito de comunicación (catalán + castellano + inglés)","sourceNote":"La pauta 2/2026 trabaja listening, vocabulario funcional, lectura, gramática en contexto y writing. El nivel operativo es básico, pero las respuestas deben ser completas y comprensibles.","examWeight":"Modelo 2/2026: comprensión oral, uso de la lengua/lectura y producción escrita hasta 100 puntos.","chapters":[{"title":"Base de la oración, pronombres y preguntas","goals":["Word order: construir sujeto-verbo-complemento","Pronouns: elegir sujeto, objeto y posesivo","Questions: usar auxiliar correcto","There/be: describir existencia y estado"],"sections":[["Explicación desde cero",["The usual order is Subject + Verb + Object/Complement: 'I use my phone every day'. English normally requires an explicit subject.","Subject pronouns: I, you, he, she, it, we, they. Object: me, you, him, her, it, us, them. Possessive adjectives go before nouns: my phone; possessive pronouns stand alone: mine.","With be, invert: Are you tired? With ordinary verbs use do/does/did: Do you work? Did she call? The main verb stays in base form after the auxiliary.","There is/are introduces existence; have got expresses possession. Choose singular/plural and some/any according to sentence type."]]],"rules":["Statement: S+V+O","Be question: Be+S...?","Other verb: Do/Does/Did+S+base...?","Wh-word + auxiliary + subject + verb"],"examples":[["Question","She works at home → Does she work at home? Not 'Does she works'."],["Pronoun","I know Marta → I know her. This is Marta's bag → It is her bag / It is hers."]],"mistakes":["Dropping the subject.","Using he for objects instead of it.","Keeping -s after does."],"exam":"The official paper gives instructions in Catalan but tasks in English. Full-sentence answers receive more credit than isolated words.","exercises":["Order: every day / uses / she / a computer.","Replace 'Tom' in 'I see Tom'.","Question: They live here.","Question: He went yesterday.","Complete: ___ two shops near my house."],"solutions":["She uses a computer every day.","I see him.","Do they live here?","Did he go yesterday?","There are two shops near my house."],"checklist":["I keep English word order.","I choose pronouns.","I form questions with auxiliaries."]},{"title":"Present simple and present continuous","goals":["Present simple: habits and facts","Third person: add -s correctly","Frequency: place adverbs","Present continuous: describe now and temporary situations"],"sections":[["Explicación desde cero",["Use present simple for routines, repeated actions, facts and states: 'I work from home'. With he/she/it add -s/-es; have becomes has.","Negatives use don't/doesn't + base; questions do/does. Adverbs usually go before the main verb but after be: I often call; I am often tired.","Present continuous is be + verb-ing for actions happening now or temporary arrangements: 'She is studying now'. Some stative verbs such as know, like and need are not normally continuous at this level.","Time markers help: every day, usually, never versus now, at the moment, today."]]],"rules":["Present simple: S+V(s)","Continuous: am/is/are+V-ing","doesn't + base form"],"examples":[["Contrast","I usually drive to work, but today I am taking the train."],["Third person","He watches videos and studies online. watch→watches; study→studies."]],"mistakes":["He don't works.","I am knowing.","Forgetting be in 'She studying'."],"exam":"Reading and writing tasks often ask about habits, technology, social media and personal routines.","exercises":["She __ (work) every afternoon.","They __ (study) now.","Make negative: He likes games.","Question: You are listening.","Write two sentences contrasting routine/today."],"solutions":["works.","are studying.","He doesn't like games.","Are you listening?","Example: I usually eat at home, but today I am having lunch at work."],"checklist":["I use do/does.","I add -s only where needed.","I distinguish routine/now."]},{"title":"Past simple and past continuous","goals":["Past simple: tell finished events","Irregular verbs: learn high-frequency forms","Past continuous: describe background","Narrative: combine when and while"],"sections":[["Explicación desde cero",["Past simple describes completed past actions: yesterday, last week, in 2024. Regular verbs add -ed; irregular forms must be learned: went, saw, had, made, took, came, got.","Negatives and questions use did + base: didn't go; Did you see? Be uses was/were directly.","Past continuous was/were + -ing sets background or action in progress. A shorter event often interrupts: I was driving when it started to rain.","Use while with the longer simultaneous action and when for the event or time link, though real use can vary."]]],"rules":["Past: V-ed / irregular","Negative: didn't+base","Continuous: was/were+V-ing"],"examples":[["Narrative","While I was waiting, I checked my phone. Then the bus arrived."],["Question","She bought a laptop → Did she buy a laptop?"]],"mistakes":["Did you went?","I was go.","Mixing present and past in one story."],"exam":"The 2026 reading about Steve Jobs required ordering life events, so past verbs and chronology are essential.","exercises":["Past of go, buy, meet, become, find.","Negative: They started in 1976.","Question: He made a computer.","Complete: I __ (walk) when I __ (see) her.","Write three ordered past events."],"solutions":["went, bought, met, became, found.","They didn't start in 1976.","Did he make a computer?","was walking; saw.","Open answer with consistent past and sequence words."],"checklist":["I know 30 common irregular verbs.","I use did+base.","I combine background and event."]},{"title":"Present perfect and future forms","goals":["Present perfect: connect past and present","For/since: express duration","Will: predictions and instant decisions","Going to/present continuous: express plans"],"sections":[["Explicación desde cero",["Present perfect is have/has + past participle. Use for experience without finished time, recent result or unfinished period: I have visited London; She has lost her keys.","Use since with starting point and for with duration. Avoid present perfect with a finished time such as yesterday: I saw it yesterday.","Will expresses prediction, promise or instant decision. Be going to expresses intention or prediction from evidence. Present continuous can express fixed arrangement.","At A2 the aim is clear meaning, not subtle perfection. Choose one form consistently and add a time expression."]]],"rules":["have/has + past participle","since + point; for + period","will + base","be going to + base"],"examples":[["Experience","Have you ever used a tablet? Yes, I have. I used one at school last year."],["Future","Look at those clouds: it is going to rain. I think technology will change work."]],"mistakes":["I have seen it yesterday.","She will to go.","I going to study."],"exam":"May appear in grammar gaps or a short composition about experience and plans; simpler correct sentences score better.","exercises":["Complete: She __ never __ (try) it.","for/since: 2024; two years.","Correct: I have bought it last week.","Plan sentence with going to.","Prediction with will."],"solutions":["has never tried.","since 2024; for two years.","I bought it last week.","Example: I am going to study English tonight.","Example: Cars will become more efficient."],"checklist":["I form participles.","I distinguish finished time.","I express plans/predictions."]},{"title":"Modal verbs, imperatives and comparison","goals":["Can/could: express ability and requests","Must/have to/should: obligation and advice","Comparatives: compare two","Superlatives: identify extremes"],"sections":[["Explicación desde cero",["Modal verbs are followed by base form without to: can drive, should study. Can is ability/permission; could past ability or polite request.","Must expresses strong speaker obligation; have to external requirement; mustn't prohibition; don't have to no necessity. Should gives advice.","Short adjectives take -er/-est; long adjectives use more/most. Irregular: good-better-best; bad-worse-worst. Use than after comparative and the before superlative.","Imperative uses base form: Turn off the screen. Negative: Don't share your password."]]],"rules":["modal + base","mustn't ≠ don't have to","adj-er than / more adj than","the adj-est / the most adj"],"examples":[["Advice","You should take b async function init(){
  state.data=JSON.parse(document.getElementById('curriculum-data').textContent);
  const diff=Math.ceil((new Date('2026-11-05T10:00:00+01:00')-new Date())/86400000);$('#daysLeft').textContent=diff>0?`${diff} días`:'Convocatoria en curso';

}
function updateStreak(){const today=new Date().toISOString().slice(0,10);if(progress.lastDay!==today){const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);progress.streak=progress.lastDay===yesterday?(progress.streak||0)+1:1;progress.lastDay=today;store.write(progress)}}
function bindShell(){
  $$('.nav-item').forEach(b=>b.onclick=()=>navigate(b.dataset.route));
  $('#menuBtn').onclick=()=>$('.sidebar').classList.toggle('open');
  $('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('geso-theme',document.body.classList.contains('dark')?'dark':'light')};
  if(localStorage.getItem('geso-theme')==='dark')document.body.classList.add('dark');

  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();state.deferred=e;$('#installBtn').classList.remove('hidden')});
  $('#installBtn').onclick=async()=>{if(state.deferred){state.deferred.prompt();await state.deferred.userChoice;state.deferred=null;$('#installBtn').classList.add('hidden')}};
}
function navigate(route,params={}){state.route=route;Object.assign(state,params);$$('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.route===route));$('.sidebar').classList.remove('open');render()}

function subjectPct(s){const n=s.chapters.filter((_,i)=>progress.done[`${s.key}:${i}`]).length;return Math.round(n/s.chapters.length*100)}
function subjectCard(s){const pct=subjectPct(s);return `<article class="subject-card" style="--subject:${s.color}" data-subject="${s.key}"><div class="subject-icon">${icons[s.key]}</div><h3>${esc(s.title)}</h3><p>${s.chapters.length} temas · ${s.questions.length} actividades</p><div class="progress"><span style="width:${pct}%"></span></div><div class="subject-meta"><span>${pct}% completado</span><span>${s.chapters.filter((_,i)=>progress.done[`${s.key}:${i}`]).length}/${s.chapters.length}</span></div></article>`}
function bindSubjectCards(){$$('[data-subject]').forEach(el=>el.onclick=()=>navigate('subject',{subject:state.data.subjects.find(s=>s.key===el.dataset.subject)}))}
function renderDashboard(){setTitle('Inicio');const done=Object.keys(progress.done).length,total=state.data.subjects.reduce((a,s)=>a+s.chapters.length,0),avg=progress.attempts.length?Math.round(progress.attempts.reduce((a,x)=>a+x.score,0)/progress.attempts.length):0;
  $('#view').innerHTML=`<div class="hero"><section class="hero-card"><small>PLAN ACTIVO · NOVIEMBRE 2026</small><h2>Hoy toca avanzar, aunque sea un tema. El aprobado no se negocia.</h2><p>Continúa por el siguiente capítulo pendiente o haz una tanda rápida de preguntas para detectar qué necesitas repasar.</p><div class="hero-actions"><button class="btn btn-primary" data-go="subjects">Seguir estudiando</button><button class="btn btn-light" data-go="practice">Práctica rápida</button></div></section><aside class="exam-info"><h3>Fechas oficiales</h3><div class="date-row"><div class="date-badge">05<small>NOV</small></div><div><strong>Científico-tecnológico · 10:00</strong><span>Social · 15:30</span></div></div><div class="date-row"><div class="date-badge">06<small>NOV</small></div><div><strong>Catalán y castellano · 10:00</strong><span>Inglés · 13:30</span></div></div></aside></div><div class="section-head"><div><h2>Tu avance</h2><p>El progreso se guarda en este dispositivo.</p></div></div><div class="stats"><div class="stat"><small>Temas terminados</small><strong>${done}/${total}</strong><span class="delta">${Math.round(done/total*100)}% del recorrido</span></div><div class="stat"><small>Racha</small><strong>${progress.streak} días</strong><span class="delta">Mantén el ritmo</span></div><div class="stat"><small>Nota media</small><strong>${avg}%</strong><span class="delta">En prácticas corregidas</span></div><div class="stat"><small>Errores guardados</small><strong>${progress.errors.length}</strong><span class="delta">Tu lista de repaso</span></div></div><div class="section-head"><div><h2>Materias</h2><p>75 temas completos y práctica acumulativa.</p></div></div><div class="subject-grid">${state.data.subjects.map(subjectCard).join('')}</div>`;
  $$('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));bindSubjectCards()}
function renderSubjects(){setTitle('Materias','BIBLIOTECA');$('#view').innerHTML=`<div class="section-head"><div><h2>Los ocho libros en una sola aula</h2><p>Teoría, ejercicios, soluciones y entrenamiento específico.</p></div></div><div class="subject-grid">${state.data.subjects.map(subjectCard).join('')}</div>`;bindSubjectCards()}
function renderSubject(){const s=state.subject||state.data.subjects[0];setTitle(s.title,'MATERIA');$('#view').innerHTML=`<section class="panel subject-header" style="--subject:${s.color}"><div><h2>${esc(s.title)}</h2><p>${esc(s.subtitle)}</p><p style="margin-top:12px"><strong>Patrón oficial:</strong> ${esc(s.sourceNote)}</p></div><div class="chapter-actions"><button data-practice-sub="${s.key}">Practicar</button><a class="btn btn-primary" href="${s.pdf}" target="_blank">Abrir libro PDF</a></div></section><div class="section-head"><div><h2>Temario</h2><p>${s.chapters.length} capítulos · marca solo lo que puedas explicar sin mirar.</p></div></div><div class="chapter-list">${s.chapters.map((c,i)=>{const done=progress.done[`${s.key}:${i}`];return `<article class="chapter-row"><div class="num">${i+1}</div><div><h3>${esc(c.title)}</h3><p>${esc(c.goals.slice(0,2).join(' · '))}</p></div><div class="chapter-actions"><button data-open="${i}">Estudiar</button><button data-done="${i}" class="${done?'done':''}">${done?'✓ Dominado':'Marcar hecho'}</button></div></article>`}).join('')}</div>`;
  $$('[data-open]').forEach(b=>b.onclick=()=>openLesson(s,+b.dataset.open));$$('[data-done]').forEach(b=>b.onclick=()=>toggleDone(s,+b.dataset.done));$('[data-practice-sub]').onclick=()=>navigate('practice',{subject:s})}
function toggleDone(s,i){const k=`${s.key}:${i}`;progress.done[k]=!progress.done[k];if(!progress.done[k])delete progress.done[k];store.write(progress);renderSubject();toast(progress.done[k]?'Tema marcado como dominado':'Tema devuelto a pendientes')}
function openLesson(s,i){const c=s.chapters[i],dialog=$('#studyDialog');$('#dialogContent').innerHTML=`<article class="lesson" style="--subject:${s.color}"><small>TEMA ${i+1} · ${esc(s.title).toUpperCase()}</small><h2>${esc(c.title)}</h2><div class="lesson-box"><strong>Qué tienes que saber</strong><ul>${c.goals.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>${c.sections.map(([h,ps])=>`<h3>${esc(h)}</h3>${ps.map(p=>`<p>${esc(p)}</p>`).join('')}`).join('')}<h3>Reglas y fórmulas</h3>${c.rules.map(r=>`<div class="formula">${esc(r)}</div>`).join('')}<h3>Ejemplos resueltos</h3>${c.examples.map(([t,b])=>`<div class="lesson-box"><strong>${esc(t)}</strong><p>${esc(b)}</p></div>`).join('')}<h3>Errores frecuentes</h3><ul>${c.mistakes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>Cómo aparece en el examen</h3><p>${esc(c.exam)}</p><h3>Checklist</h3><ul>${c.checklist.map(x=>`<li>□ ${esc(x)}</li>`).join('')}</ul><div class="hero-actions"><button class="btn btn-primary" id="lessonPractice">Practicar este tema</button><button class="btn btn-ghost" id="lessonDone">Marcar como dominado</button></div></article>`;dialog.showModal();$('#lessonPractice').onclick=()=>{dialog.close();startQuiz(s,i,10)};$('#lessonDone').onclick=()=>{progress.done[`${s.key}:${i}`]=true;store.write(progress);dialog.close();toast('Tema marcado como dominado');renderSubject()}}
function renderPractice(){setTitle('Practicar','ENTRENAMIENTO');const chosen=state.subject?.key||'';$('#view').innerHTML=`<section class="panel exam-setup"><h2>Configura una tanda</h2><p>Las preguntas se generan desde el contenido de los libros. Las de respuesta abierta muestran después una solución razonada para que te autocorrijas.</p><div class="setup-grid"><div class="setup-card"><label>Materia</label><select id="practiceSubject"><option value="">Todas</option>${state.data.subjects.map(s=>`<option value="${s.key}" ${s.key===chosen?'selected':''}>${esc(s.title)}</option>`).join('')}</select></div><div class="setup-card"><label>Número de preguntas</label><select id="practiceCount"><option>10</option><option>15</option><option>20</option><option>30</option></select></div></div><div class="hero-actions"><button class="btn btn-primary" id="startPractice">Empezar práctica</button></div></section>`;$('#startPractice').onclick=()=>{const key=$('#practiceSubject').value,count=+$('[id=practiceCount]').value;if(key)startQuiz(state.data.subjects.find(s=>s.key===key),null,count);else startMixedQuiz(count)}}
function startMixedQuiz(count){let pool=state.data.subjects.flatMap(s=>s.questions.map(q=>({...q,subjectKey:s.key,subjectTitle:s.title})));launchQuiz(shuffle(pool).slice(0,count),'Práctica mixta')}
function startQuiz(s,chapter,count){let pool=s.questions.filter(q=>chapter==null||q.chapter===chapter).map(q=>({...q,subjectKey:s.key,subjectTitle:s.title}));launchQuiz(shuffle(pool).slice(0,Math.min(count,pool.length)),s.title)}
function launchQuiz(questions,label){state.quiz={questions,index:0,score:0,answered:0,label,results:[]};renderQuizQuestion()}
function renderQuizQuestion(){const qz=state.quiz,q=qz.questions[qz.index];setTitle(qz.label,'PRÁCTICA');const p=Math.round(qz.index/qz.questions.length*100);$('#view').innerHTML=`<div class="quiz-shell"><div class="quiz-top"><strong>Pregunta ${qz.index+1} de ${qz.questions.length}</strong><span>${qz.score} aciertos</span></div><div class="quiz-progress"><span style="width:${p}%"></span></div><article class="question-card"><small>${esc(q.subjectTitle||'')}</small><h2>${esc(q.prompt)}</h2>${q.type==='mcq'?q.options.map((o,i)=>`<button class="option" data-option="${i}">${esc(o)}</button>`).join(''):`<textarea class="open-answer" id="openAnswer" placeholder="Escribe tu respuesta y justifica el procedimiento…"></textarea><button class="btn btn-primary" id="showSolution">Ver solución</button>`}<div id="feedback"></div></article></div>`;
  if(q.type==='mcq')$$('[data-option]').forEach(b=>b.onclick=()=>answerMcq(q,+b.dataset.option));else $('#showSolution').onclick=()=>showOpenSolution(q)}
function answerMcq(q,choice){if(state.quiz.locked)return;state.quiz.locked=true;const correct=choice===q.answer;state.quiz.answered++;if(correct)state.quiz.score++;$$('[data-option]').forEach((b,i)=>{b.disabled=true;b.classList.toggle('correct',i===q.answer);b.classList.toggle('wrong',i===choice&&!correct)});if(!correct)addError(q);$('#feedback').innerHTML=`<div class="explanation"><strong>${correct?'Correcto':'No exactamente'}</strong><p>${esc(q.explanation)}</p><button class="btn btn-primary" id="nextQuestion">${state.quiz.index===state.quiz.questions.length-1?'Ver resultado':'Siguiente'}</button></div>`;$('#nextQuestion').onclick=nextQuiz}
function showOpenSolution(q){const answer=$('#openAnswer').value.trim();$('#feedback').innerHTML=`<div class="solution"><strong>Solución orientativa</strong><p>${esc(q.solution)}</p><p><b>Tu respuesta:</b> ${esc(answer||'Sin respuesta')}</p><div class="hero-actions"><button class="btn btn-primary" data-self="1">La tenía bien</button><button class="btn btn-ghost" data-self="0">Debo repasarla</button></div></div>`;$$('[data-self]').forEach(b=>b.onclick=()=>{state.quiz.answered++;if(b.dataset.self==='1')state.quiz.score++;else addError(q);nextQuiz()})}
function addError(q){if(!progress.errors.some(x=>x.id===q.id))progress.errors.unshift({id:q.id,prompt:q.prompt,explanation:q.explanation||q.solution,subject:q.subjectTitle,date:new Date().toISOString()});store.write(progress)}
function nextQuiz(){state.quiz.locked=false;state.quiz.index++;if(state.quiz.index>=state.quiz.questions.length)finishQuiz();else renderQuizQuestion()}
function finishQuiz(){const qz=state.quiz,pct=Math.round(qz.score/qz.questions.length*100);progress.attempts.unshift({date:new Date().toISOString(),label:qz.label,score:pct});progress.attempts=progress.attempts.slice(0,50);store.write(progress);setTitle('Resultado','PRÁCTICA TERMINADA');$('#view').innerHTML=`<div class="quiz-shell"><section class="question-card" style="text-align:center"><small>RESULTADO</small><h2 style="font-size:52px;margin:12px">${pct}%</h2><p>${pct>=80?'Buen dominio. Mantén el repaso espaciado.':pct>=50?'Vas encaminada, pero revisa los errores antes de seguir.':'Toca volver a la teoría y repetir la tanda. Sin dramas, pero sin autoengaños.'}</p><div class="hero-actions" style="justify-content:center"><button class="btn btn-primary" data-go="practice">Otra práctica</button><button class="btn btn-ghost" data-go="errors">Revisar errores</button></div></section></div>`;$$('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go))}
function renderExamSetup(){setTitle('Simulacros','MODO EXAMEN');$('#view').innerHTML=`<section class="panel exam-setup"><h2>Simulacro configurable</h2><p>El cronómetro no se detiene al cambiar de pregunta. Las preguntas cerradas se corrigen automáticamente; las abiertas se comparan con una solución explicada.</p><div class="setup-grid"><div class="setup-card"><label>Materia</label><select id="examSubject">${state.data.subjects.map(s=>`<option value="${s.key}">${esc(s.title)}</option>`).join('')}<option value="mixed">Mixto científico-tecnológico</option></select></div><div class="setup-card"><label>Duración</label><select id="examMinutes"><option value="30">30 minutos</option><option value="60" selected>60 minutos</option><option value="120">120 minutos</option><option value="180">180 minutos</option></select></div><div class="setup-card"><label>Preguntas</label><select id="examCount"><option>20</option><option selected>30</option><option>40</option></select></div><div class="setup-card"><label>Corrección</label><p>1 punto por pregunta. Las abiertas se autocorrigen de forma honesta.</p></div></div><div class="hero-actions"><button class="btn btn-primary" id="startExam">Iniciar simulacro</button></div></section>`;$('#startExam').onclick=startExam}
function startExam(){const key=$('#examSubject').value,mins=+$('#examMinutes').value,count=+$('#examCount').value;let pool;if(key==='mixed')pool=state.data.subjects.filter(s=>['matematicas','fisica_quimica','biologia_geologia','tecnologia'].includes(s.key)).flatMap(s=>s.questions.map(q=>({...q,subjectKey:s.key,subjectTitle:s.title})));else{const s=state.data.subjects.find(x=>x.key===key);pool=s.questions.map(q=>({...q,subjectKey:s.key,subjectTitle:s.title}))}state.exam={end:Date.now()+mins*60000,timer:setInterval(updateTimer,1000)};launchQuiz(shuffle(pool).slice(0,Math.min(count,pool.length)),key==='mixed'?'Ámbito científico-tecnológico':state.data.subjects.find(x=>x.key===key).title);setTimeout(updateTimer,10)}
function updateTimer(){if(!state.exam)return;const left=Math.max(0,state.exam.end-Date.now()),m=Math.floor(left/60000),s=Math.floor(left%60000/1000);let el=$('.quiz-top span');if(el)el.innerHTML=`<span class="timer">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</span> · ${state.quiz.score} aciertos`;if(left<=0){clearInterval(state.exam.timer);state.exam=null;finishQuiz()}}
function renderFlashcards(){setTitle('Tarjetas','MEMORIA ACTIVA');const cards=state.data.subjects.flatMap(s=>s.chapters.flatMap((c,ci)=>[...c.rules.map(r=>({subject:s.title,color:s.color,front:`Explica y aplica esta regla: ${r}`,back:c.sections[0][1][0]})),...c.mistakes.map(m=>({subject:s.title,color:s.color,front:`Corrige este error: ${m}`,back:`Revisa el tema «${c.title}» y compáralo con: ${c.rules[0]||c.goals[0]}`}))]));if(!state.flash)state.flash={cards:shuffle(cards),index:0,back:false};const c=state.flash.cards[state.flash.index];$('#view').innerHTML=`<div class="flashcard" id="flashcard" style="border-top:6px solid ${c.color}"><div class="side"><small>${esc(c.subject).toUpperCase()}</small><h2>${esc(state.flash.back?c.back:c.front)}</h2><p>${state.flash.back?'Pulsa para volver a la pregunta':'Piensa la respuesta antes de girar'}</p></div></div><div class="flash-actions"><button class="btn btn-ghost" id="againCard">Otra vez</button><button class="btn btn-primary" id="knowCard">La sé</button></div>`;$('#flashcard').onclick=()=>{state.flash.back=!state.flash.back;renderFlashcards()};$('#againCard').onclick=()=>nextCard(false);$('#knowCard').onclick=()=>nextCard(true)}
function nextCard(known){const f=state.flash;if(!known){const [c]=f.cards.splice(f.index,1);f.cards.splice(Math.min(f.index+4,f.cards.length),0,c)}else f.index=(f.index+1)%f.cards.length;f.back=false;renderFlashcards()}
function renderErrors(){setTitle('Mis errores','REPASO INTELIGENTE');$('#view').innerHTML=progress.errors.length?`<section class="panel"><h2>Lista de errores</h2><p>Corrige estas preguntas 48 horas después. Cuando puedas explicarlas sin mirar, elimínalas.</p>${progress.errors.map((e,i)=>`<article class="error-item"><small>${esc(e.subject||'Materia')} · ${new Date(e.date).toLocaleDateString('es-ES')}</small><strong style="display:block;margin:5px 0">${esc(e.prompt)}</strong><p>${esc(e.explanation)}</p><button class="btn btn-ghost" data-clear-error="${i}">Ya la domino</button></article>`).join('')}</section>`:`<div class="empty"><h2>Aún no hay errores guardados</h2><p>Eso puede significar dos cosas: vas fina… o todavía no has hecho suficientes preguntas.</p><button class="btn btn-primary" data-go="practice">Empezar práctica</button></div>`;$$('[data-clear-error]').forEach(b=>b.onclick=()=>{progress.errors.splice(+b.dataset.clearError,1);store.write(progress);renderErrors()});$$('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
init().catch(err=>{$('#view').innerHTML=`<div class="empty"><h2>No se ha podido cargar el contenido</h2><p>${esc(err.message)}</p></div>`});
</script>
</body>
</html>
